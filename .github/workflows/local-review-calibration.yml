name: HeroVerse local reviewer calibration (known answers, CPU only)
# Manual research only. Never approves, publishes or chooses a production reviewer.
on:
  workflow_dispatch:
    inputs:
      pilot:
        description: QA-PASS pilot with retained render
        type: choice
        required: true
        options: [pilot-005, pilot-006]
      model:
        description: Apache-2.0 candidate and immutable revision
        type: choice
        required: true
        default: HuggingFaceTB/SmolVLM2-2.2B-Instruct@482adb537c021c86670beed01cd58990d01e72e4
        options:
          - HuggingFaceTB/SmolVLM2-2.2B-Instruct@482adb537c021c86670beed01cd58990d01e72e4
permissions:
  contents: write
concurrency:
  group: heroverse-local-review-calibration
  cancel-in-progress: false
jobs:
  calibrate:
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.0.0-cloud-assets-20261013
      PILOT: ${{ inputs.pilot }}
      CANDIDATE: ${{ inputs.model }}
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Validate inputs and download hash-verified QA-PASS render
        run: |
          case "$PILOT" in pilot-005|pilot-006) ;; *) exit 1;; esac
          case "$CANDIDATE" in HuggingFaceTB/SmolVLM2-2.2B-Instruct@482adb537c021c86670beed01cd58990d01e72e4) ;; *) exit 1;; esac
          d="migration/production/$PILOT"
          read -r st sha < <(python3 -I -c "import json,sys;q=json.load(open(sys.argv[1]));print(q['status'],q['output_sha256'])" "$d/out/qa.json")
          [ "$st" = PASS ] || { echo "QA_NOT_PASS"; exit 1; }
          [[ "$sha" =~ ^[a-f0-9]{64}$ ]] || exit 1
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$PILOT-sha256-$sha.mp4" -O "$RUNNER_TEMP/$PILOT.mp4"
          echo "$sha  $RUNNER_TEMP/$PILOT.mp4" | sha256sum -c -
          echo "RENDER_SHA256=$sha" >> "$GITHUB_ENV"
          mkdir -p migration/evidence/review-calibration
      - name: Pinned CPU runtime (only this manual workflow installs ML)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg python3-venv
          python3 -m venv "$RUNNER_TEMP/local-review-venv"
          py="$RUNNER_TEMP/local-review-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          "$py" -m pip install --disable-pip-version-check transformers==4.57.1 Pillow==11.3.0 num2words==0.5.14 openai-whisper==20250625
          "$py" -m pip check
      - name: Local cases (frames plus timestamped ASR, no native audio to VLM)
        run: |
          model="${CANDIDATE%@*}"
          revision="${CANDIDATE##*@}"
          slug="${model//\//--}"
          title=$(python3 -I -c "import json,sys;print(json.load(open(sys.argv[1]))['working_title'])" "migration/production/$PILOT/script.json")
          "$RUNNER_TEMP/local-review-venv/bin/python" -I -B migration/production/local_review.py \
            "$RUNNER_TEMP/$PILOT.mp4" "$RUNNER_TEMP/local-cases" \
            "$RUNNER_TEMP/local-review.json" "$title" "$model" "$revision"
      - name: Record evidence, including ERROR cases
        if: always()
        run: |
          model="${CANDIDATE%@*}"
          slug="${model//\//--}"
          evidence="migration/evidence/review-calibration/$PILOT-$slug.json"
          [ -f "$RUNNER_TEMP/local-review.json" ] || { echo "NO_CURRENT_RUN_CALIBRATION_EVIDENCE"; exit 0; }
          python3 -I - "$RUNNER_TEMP/local-review.json" "$evidence" <<'PY'
          import json, os, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          assert data['render'] == os.environ['PILOT'] + '.mp4'
          assert data['model'] + '@' + data['revision'] == os.environ['CANDIDATE']
          assert not data.get('test_stub')
          p = Path(sys.argv[2]); p.parent.mkdir(parents=True, exist_ok=True)
          data['render_sha256'] = os.environ['RENDER_SHA256']
          data['workflow_run_id'] = os.environ['GITHUB_RUN_ID']
          p.write_text(json.dumps(data, indent=1, ensure_ascii=False, allow_nan=False) + '\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$evidence"
          git commit -q -m "Record local review calibration $PILOT $model (run $GITHUB_RUN_ID)" || exit 0
          for i in 1 2 3 4; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true; sleep $((i * 5))
          done
          exit 1
