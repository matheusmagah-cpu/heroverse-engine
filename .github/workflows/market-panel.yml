name: HeroVerse market panel (English Christian niche, read-only Data API)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
permissions:
  contents: write
concurrency:
  group: heroverse-official-evidence
  cancel-in-progress: false
jobs:
  panel:
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.event.repository.private == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.0.0-cloud-assets-20261013
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Unit tests
        run: /usr/bin/python3 -I -B migration/mining/test_market_panel.py
      - name: Collect panel (about 6,500 Data API units, no media)
        env:
          HERO_YT_AUTHORIZED_USER_JSON: ${{ secrets.HERO_YT_AUTHORIZED_USER_JSON }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check -q google-auth==2.40.3 requests==2.32.4
          day=$(date -u +%Y%m%d)
          echo "DAY=$day" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/venv/bin/python" -I -B migration/mining/market_panel.py "$RUNNER_TEMP/market-panel-$day.json" 6500 "migration/evidence/market-panel/panel-$day.json"
      - name: Market model and scoring of registered forecasts
        run: |
          python3 -I -B migration/mining/ypp_market_model.py "migration/evidence/ypp-market-model-$DAY.json" "migration/evidence/market-panel/panel-$DAY.json"
          for reg in migration/evidence/market-forecast-registered-*.json; do
            python3 -I -B migration/mining/market_forecast.py evaluate "$reg" "migration/evidence/market-panel/panel-$DAY.json" \
              "migration/evidence/market-forecast-eval-$(basename "$reg" .json | sed 's/market-forecast-registered-//')-at-$DAY.json"
          done
      - name: Daily intelligence (production directives of the day)
        run: |
          mkdir -p migration/evidence/daily-intel
          python3 -I -B migration/mining/daily_intel.py "$RUNNER_TEMP/market-panel-$DAY.json" "migration/evidence/daily-intel/intel-$DAY.json"
      - name: Raw panel to the private release, compact panel to Git
        run: |
          gzip -9 "$RUNNER_TEMP/market-panel-$DAY.json"
          gh release upload "$TAG" "$RUNNER_TEMP/market-panel-$DAY.json.gz" --repo "$GITHUB_REPOSITORY" --clobber
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration/evidence/market-panel migration/evidence/ypp-market-model-*.json migration/evidence/market-forecast-eval-*.json migration/evidence/daily-intel
          git commit -q -m "Record market panel $DAY (run $GITHUB_RUN_ID)"
          git pull --rebase -q origin main && git push -q origin HEAD:main
