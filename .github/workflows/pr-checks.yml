name: HeroVerse PR checks (unit tests + pilot acceptance)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
# E102: a new push to the same PR replaces its running check (the newest commit is checked in full; the replaced
# commit can no longer merge). Runs of different PRs never cancel each other.
concurrency:
  group: heroverse-pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: ffmpeg and OpenCV for the video tests
        timeout-minutes: 6
        run: |
          # E55: the official Ubuntu origins and a timeout on every command (migration/ci/apt_install.sh)
          if ! command -v ffmpeg >/dev/null || ! python3 -c 'import numpy, cv2, PIL' 2>/dev/null; then
            APT_UPDATE_TIMEOUT=90s APT_INSTALL_TIMEOUT=180s bash migration/ci/apt_install.sh ffmpeg python3-numpy python3-opencv python3-pil
          fi
          command -v ffmpeg
          python3 -c 'import numpy, cv2, PIL; print("Video test dependencies available")'
      - name: Unit tests (no network, no secrets)
        # E102: every test starts after the video tools are installed; each runs in its own process, one per CPU at
        # a time; every result is printed in list order and any failure or a test that never reported fails the step
        timeout-minutes: 8
        run: |
          fail=0; i=0; R="$RUNNER_TEMP/tests"; mkdir -p "$R"
          for t in migration/production/test_script_check.py migration/production/test_render_queue.py migration/production/test_qa_pilot.py migration/production/test_preview_gate.py migration/production/bible/test_clip_check.py migration/production/bible/test_short_engine.py migration/production/bible/test_plan_check.py migration/production/bible/test_long_plan_check.py migration/production/bible/test_episode_build.py migration/production/bible/test_episode_preflight.py migration/production/bible/test_long_preflight.py migration/production/bible/test_long_build.py migration/production/bible/test_shot_sources.py migration/production/bible/test_episode_order.py migration/production/bible/test_lipsync_check.py migration/production/bible/test_scene_stills.py migration/production/bible/test_thumbs.py \
                   migration/production/test_still_render.py migration/production/test_long_review.py migration/production/characters/test_characters.py \
                   migration/production/test_shorts_review.py migration/production/test_shorts_edit_plan.py migration/production/test_no_live_pilot_data.py migration/production/test_signal_scan.py migration/production/test_cinematic.py migration/production/footage/test_footage.py migration/production/footage/test_assign.py migration/production/footage/test_pavo_footage.py migration/publish/test_*.py migration/ops/test_heartbeat.py migration/ops/test_runner_dispatch.py migration/ops/test_engine_fallback.py migration/ops/test_release_video.py migration/ops/test_release_assets.py migration/ops/test_errors_register.py migration/ops/test_runway.py migration/ops/test_minutes.py migration/ops/test_project_map.py migration/ops/test_hookify_rules.py migration/ops/test_refusal_parity.py migration/ops/test_dispatch_guard.py migration/ops/test_schedules.py \
                   migration/mining/test_market_evidence.py migration/mining/test_gemini_public_av.py migration/mining/test_structure_mining.py migration/mining/test_video_analysis_card.py migration/mining/test_owned_feedback.py migration/mining/test_learning_loop.py migration/mining/test_live_intel.py \
                   migration/mining/test_goal_report.py migration/mining/test_reach_report.py migration/mining/test_market_panel.py migration/mining/test_daily_intel.py migration/strategy/test_ads_model.py \
                   migration/mining/test_packaging_mining.py migration/mining/test_thumb_study.py migration/production/test_thumb_check.py migration/production/test_reviewer_calibration.py migration/production/imagegen/test_cf_images.py migration/ci/test_smoke.py migration/ci/test_ci_setup.py migration/test_second_opening_asr.py migration/integrations/tiktok-local/test_tiktok_core.py; do
            i=$((i+1)); n=$(printf %03d "$i"); echo "$t" > "$R/$n.name"
            ( rc=0; python3 -I -B "$t" > "$R/$n.out" 2>&1 || rc=$?; echo "$rc" > "$R/$n.rc" ) &
            while [ "$(jobs -rp | wc -l)" -ge "$(nproc)" ]; do wait -n || true; done
          done
          wait
          for f in "$R"/*.name; do
            n=${f%.name}; t=$(cat "$f")
            if [ "$(cat "$n.rc" 2>/dev/null)" = 0 ]; then echo "PASS $t"; else echo "FAIL $t"; tail -20 "$n.out"; fail=1; fi
          done
          [ "$i" -gt 0 ] || { echo "NO_TESTS_RAN"; exit 1; }
          exit $fail
      - name: Acceptance of every pilot this PR touches
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          pilots=$(git diff --name-only "$base" HEAD | sed -n 's#^migration/production/\(pilot-[0-9][0-9][0-9]\)/.*#\1#p' | sort -u)
          [ -n "$pilots" ] || { echo "NO_PILOT_CHANGED"; exit 0; }
          fail=0
          for p in $pilots; do
            [ -f "migration/production/$p/script.json" ] || continue
            [ -d "migration/production/$p/out" ] && { echo "SKIP $p (already rendered: frozen)"; continue; }
            python3 -I -B migration/production/script_check.py "migration/production/$p" || fail=1
          done
          exit $fail
