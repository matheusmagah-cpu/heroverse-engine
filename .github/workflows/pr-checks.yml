name: HeroVerse PR checks (unit tests + pilot acceptance)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  issues: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: ffmpeg and OpenCV for the video tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg python3-numpy python3-opencv
      - name: Unit tests (no network, no secrets)
        run: |
          fail=0
          for t in migration/production/test_script_check.py migration/production/test_render_queue.py \
                   migration/production/test_still_render.py migration/production/test_long_review.py migration/production/test_review_calibration.py migration/production/test_local_review.py \
                   migration/production/test_shorts_produce.py migration/production/test_signal_scan.py migration/production/test_cinematic.py migration/publish/test_*.py migration/ops/test_heartbeat.py migration/ops/test_runner_dispatch.py migration/ops/test_dot_scope.py migration/ops/test_errors_register.py migration/ops/test_runway.py migration/ops/test_card_check.py migration/ops/test_minutes.py \
                   migration/mining/test_market_evidence.py migration/mining/test_structure_mining.py \
                   migration/mining/test_accuracy_check.py migration/mining/test_native_metrics.py migration/mining/test_native_plan.py migration/mining/test_goal_report.py migration/mining/test_market_panel.py \
                   migration/mining/test_opportunity.py migration/mining/test_packaging_mining.py; do
            python3 -I -B "$t" > "$RUNNER_TEMP/out" 2>&1 && echo "PASS $t" || { echo "FAIL $t"; tail -20 "$RUNNER_TEMP/out"; fail=1; }
          done
          exit $fail
      - name: Dot delivery stays inside the task's ALLOWED PATHS
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          n=$(echo "$BRANCH" | sed -n 's#^dot/\([0-9]*\)-.*#\1#p')
          [ -n "$n" ] || { echo "NOT_A_DOT_BRANCH"; exit 0; }
          gh api "repos/$GITHUB_REPOSITORY/issues/$n" --jq .body > "$RUNNER_TEMP/issue.md"
          git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" > "$RUNNER_TEMP/changed.txt"
          python3 -I -B migration/ops/dot_scope.py "$BRANCH" "$RUNNER_TEMP/issue.md" "$RUNNER_TEMP/changed.txt"
          python3 -I -B migration/ops/card_check.py "$RUNNER_TEMP/issue.md" .
      - name: Acceptance of every pilot this PR touches
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          pilots=$(git diff --name-only "$base" HEAD | sed -n 's#^migration/production/\(pilot-[0-9][0-9][0-9]\)/.*#\1#p' | sort -u)
          [ -n "$pilots" ] || { echo "NO_PILOT_CHANGED"; exit 0; }
          fail=0
          for p in $pilots; do
            [ -f "migration/production/$p/script.json" ] || continue
            [ -d "migration/production/$p/out" ] && { echo "SKIP $p (already rendered: frozen)"; continue; }
            python3 -I -B migration/production/script_check.py "migration/production/$p" || fail=1
          done
          exit $fail
