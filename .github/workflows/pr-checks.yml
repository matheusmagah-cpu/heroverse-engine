name: HeroVerse PR checks (unit tests + pilot acceptance)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: ffmpeg and OpenCV for the video tests
        timeout-minutes: 6
        run: |
          # Refresh Ubuntu only. Run 39823760082 timed out fetching from the
          # hosted mirror list; use the official origins with the same signed source.
          if ! command -v ffmpeg >/dev/null || ! python3 -c 'import numpy, cv2, PIL' 2>/dev/null; then
            test -f /etc/apt/sources.list.d/ubuntu.sources
            heroverse_ci_sources="$RUNNER_TEMP/heroverse-ubuntu.sources"
            sed -e 's#mirror+file:/etc/apt/apt-mirrors.txt#https://archive.ubuntu.com/ubuntu/#g' \
                -e 's#mirror+file:/etc/apt/apt-mirrors-security.txt#https://security.ubuntu.com/ubuntu/#g' \
                /etc/apt/sources.list.d/ubuntu.sources > "$heroverse_ci_sources"
            apt_ci_opts=(-o "Dir::Etc::sourcelist=$heroverse_ci_sources" -o Dir::Etc::sourceparts=- \
              -o APT::Get::List-Cleanup=0 -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
            timeout 90s sudo apt-get "${apt_ci_opts[@]}" update
            timeout 180s sudo apt-get "${apt_ci_opts[@]}" install -y --no-install-recommends \
              ffmpeg python3-numpy python3-opencv python3-pil
          fi
          command -v ffmpeg
          python3 -c 'import numpy, cv2, PIL; print("Video test dependencies available")'
      - name: Unit tests (no network, no secrets)
        run: |
          fail=0
          for t in migration/production/test_script_check.py migration/production/test_render_queue.py migration/production/test_preview_gate.py migration/production/bible/test_clip_check.py migration/production/bible/test_short_engine.py migration/production/bible/test_plan_check.py migration/production/bible/test_episode_build.py migration/production/bible/test_lipsync_check.py \
                   migration/production/test_still_render.py migration/production/test_long_review.py migration/production/test_agnes_clip.py migration/production/characters/test_characters.py \
                   migration/production/test_shorts_produce.py migration/production/test_shorts_review.py migration/production/test_shorts_edit_plan.py migration/production/test_shorts_006_plan.py migration/production/test_shorts_006_material.py migration/production/test_shorts_006_motion.py migration/production/test_no_live_pilot_data.py migration/production/test_signal_scan.py migration/production/test_cinematic.py migration/production/footage/test_footage.py migration/production/footage/test_assign.py migration/production/footage/test_pavo_footage.py migration/publish/test_*.py migration/ops/test_heartbeat.py migration/ops/test_runner_dispatch.py migration/ops/test_engine_fallback.py migration/ops/test_release_video.py migration/ops/test_release_assets.py migration/ops/test_errors_register.py migration/ops/test_runway.py migration/ops/test_minutes.py migration/ops/test_project_map.py migration/ops/test_hookify_rules.py \
                   migration/mining/test_market_evidence.py migration/mining/test_gemini_public_av.py migration/mining/test_structure_mining.py migration/mining/test_video_analysis_card.py migration/mining/test_owned_feedback.py migration/mining/test_learning_loop.py migration/mining/test_live_intel.py \
                   migration/mining/test_accuracy_check.py migration/mining/test_native_metrics.py migration/mining/test_native_plan.py migration/mining/test_goal_report.py migration/mining/test_market_panel.py migration/mining/test_daily_intel.py migration/strategy/test_ads_model.py \
                   migration/mining/test_opportunity.py migration/mining/test_packaging_mining.py migration/mining/test_thumb_study.py migration/production/test_thumb_check.py migration/production/test_reviewer_calibration.py migration/production/imagegen/test_cf_images.py migration/ci/test_smoke.py; do
            python3 -I -B "$t" > "$RUNNER_TEMP/out" 2>&1 && echo "PASS $t" || { echo "FAIL $t"; tail -20 "$RUNNER_TEMP/out"; fail=1; }
          done
          exit $fail
      - name: Acceptance of every pilot this PR touches
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          pilots=$(git diff --name-only "$base" HEAD | sed -n 's#^migration/production/\(pilot-[0-9][0-9][0-9]\)/.*#\1#p' | sort -u)
          [ -n "$pilots" ] || { echo "NO_PILOT_CHANGED"; exit 0; }
          fail=0
          for p in $pilots; do
            [ -f "migration/production/$p/script.json" ] || continue
            [ -d "migration/production/$p/out" ] && { echo "SKIP $p (already rendered: frozen)"; continue; }
            python3 -I -B migration/production/script_check.py "migration/production/$p" || fail=1
          done
          exit $fail
