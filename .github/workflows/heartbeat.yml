name: HeroVerse heartbeat (the engine's scheduler)
# GitHub delays and drops scheduled runs under load: on 2026-10-17/18 every daily cron of this repository was
# dropped. This workflow fires at minute 41 and dispatches what is due from the real run history
# (migration/ops/heartbeat.py); it is the only cron of the daily plan (tiktok.yml keeps its own cron only as a second
# chance, E90). The Claude light clock (:14) is its watchdog: it re-dispatches this workflow when the last beat is
# more than 55 min old (single-clock design, migration/OPERATIONS.md "Clocks").
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: heroverse-heartbeat
  cancel-in-progress: false
jobs:
  beat:
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Tests of the scheduler
        run: python3 -I -B migration/ops/test_heartbeat.py
      - name: Preview the next script before its full render (preview_gate.py; one preview at a time)
        run: |
          pilot=$(python3 -I -B migration/production/render_queue.py migration/production migration/publish/ledger.json preview 72)
          [ -n "$pilot" ] || { echo "NO_PREVIEW_DUE"; exit 0; }
          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pilot-preview.yml --limit 5 --json status --jq '[.[]|select(.status!="completed")]|length')
          if [ "$active" = 0 ]; then echo "DISPATCH preview $pilot"; gh workflow run pilot-preview.yml --repo "$GITHUB_REPOSITORY" --ref main -f pilot="$pilot"; else echo "PREVIEW_ACTIVE"; fi
      - name: Work waiting, run history, dispatch what is due
        run: |
          T="$RUNNER_TEMP"
          python3 -I -B migration/production/render_queue.py migration/production migration/publish/ledger.json images 72 > "$T/images"
          python3 -I -B migration/production/render_queue.py migration/production migration/publish/ledger.json reconcile 48 > "$T/reconcile"
          # a crash of the pending check must not read as "nothing waiting" (E90): tiktok.yml then runs and fails loudly
          python3 -I -B migration/publish/tiktok_publish.py pending migration/publish/ledger.json migration/publish/tiktok_ledger.json migration/production/bible/episodes > "$T/tiktok" || echo "PENDING_CHECK_FAILED" > "$T/tiktok"
          [ ! -f migration/ops/PUBLICATION_HOLD ] || : > "$T/tiktok"
          # a crash must not read as "nothing waiting": arc-links.yml then runs and fails loudly
          python3 -I -B migration/publish/arc_links.py todo > "$T/arcs" || echo "TODO_CHECK_FAILED" > "$T/arcs"
          if [ -f migration/ops/PUBLICATION_HOLD ]; then : > "$T/arcs"; fi   # owner pause: no arc links
          python3 -I -c "import json,os,sys;s=lambda p:os.path.getsize(p)>0;busy=any(l.split()[0]=='approve' for l in open(sys.argv[2]) if l.strip());json.dump({'images_missing':s(sys.argv[1]),'reconcile_todo':s(sys.argv[2]),'tiktok_pending':s(sys.argv[3]),'arc_links_todo':s(sys.argv[4]),'production_idle':not busy},open(sys.argv[5],'w'))" \
            "$T/images" "$T/reconcile" "$T/tiktok" "$T/arcs" "$T/conditions.json"
          echo '{}' > "$T/runs.json"
          for w in $(python3 -I -c "import sys;sys.path.insert(0,'migration/ops');import heartbeat as h;print(' '.join(t['workflow'] for t in h.TASKS))"); do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$w" --limit 20 --json createdAt,updatedAt,status,conclusion > "$T/r.json"
            python3 -I -c "import json,sys;a=json.load(open(sys.argv[1]));a[sys.argv[2]]=json.load(open(sys.argv[3]));json.dump(a,open(sys.argv[1],'w'))" "$T/runs.json" "$w" "$T/r.json"
          done
          cat "$T/conditions.json"; echo
          python3 -I -B migration/ops/heartbeat.py "$T/runs.json" "$T/conditions.json" > "$T/due"
          [ -s "$T/due" ] || { echo "NOTHING_DUE"; exit 0; }
          while read -r w; do
            echo "DISPATCH $w"
            gh workflow run "$w" --repo "$GITHUB_REPOSITORY" --ref main
          done < "$T/due"

  qualified-production:
    # The existing clock advances only fully qualified plans; it never generates or approves sources.
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    outputs:
      ready: ${{ steps.handoff.outputs.ready }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
      - name: Ready plans to the existing durable request queue
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 -I -B migration/ops/production_handoff.py

  submit-qualified-production:
    needs: qualified-production
    if: needs.qualified-production.outputs.ready == 'true'
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/requests.yml

  review-discovery:
    # Independent read-only inventory: a failed scheduler must not hide build evidence.
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Discover build evidence for the designated supervisor (not approval)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B migration/ops/review_discovery.py

  runner-wake:
    # Independent of the engine scheduler's NOTHING_DUE exit and failures.
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write   # E57: the engine render fallback dispatches pilot-render-stills.yml
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
      - name: Offline runner wake-up tests
        run: |
          python3 -I -B migration/ops/test_runner_dispatch.py
          python3 -I -B migration/ops/test_engine_fallback.py
      - name: Wake runner only for eligible work; render on the engine when the runner cannot be woken (E57)
        env:
          # This credential is never given to the engine scheduler or checkout.
          HERO_RUNNER_PAT: ${{ secrets.HERO_RUNNER_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if status=$(python3 -I -B migration/ops/runner_dispatch.py migration/production migration/publish/ledger.json); then
            echo "$status"; exit 0
          fi
          echo "$status"
          case "$status" in
            BLOCKED_API_HTTP_401|BLOCKED_API_HTTP_403|BLOCKED_MISSING_HERO_RUNNER_PAT)
              echo "::warning::Runner unavailable ($status); rendering on the engine instead (E57)"
              python3 -I -B migration/ops/engine_fallback.py migration/production migration/publish/ledger.json ;;
            *) exit 1 ;;
          esac
