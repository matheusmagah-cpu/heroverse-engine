name: HeroVerse animation render test (Blender, standard runner)
# Validation before any matrix: graphics context, time per frame, memory, disk, preparation,
# transfer, and the join of two consecutive chunks rendered by separate processes.
# Renders only; no audio, no publication. Artifacts kept 3 days.
on:
  workflow_dispatch:
    inputs:
      project:
        description: Folder under migration/production/animation
        required: true
        default: the-bag-he-almost-passed
      master_start:
        description: First master frame of the join test (two chunks of `frames` each follow)
        required: true
        default: '920'
      frames:
        description: Frames per test chunk
        required: true
        default: '5'
      vertical_start:
        description: First vertical index (unique_times) to render
        required: true
        default: '200'
permissions:
  contents: read
concurrency:
  group: heroverse-animation-test
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      BLENDER_URL: https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz
      BLENDER_SHA_URL: https://download.blender.org/release/Blender4.3/blender-4.3.2.sha256
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Bundle integrity (hashes in manifest.json)
        run: |
          B="migration/production/animation/${{ inputs.project }}/render-bundle"
          python3 -I - "$B" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          b = Path(sys.argv[1]); m = json.loads((b / "manifest.json").read_text())
          for a in m["assets"]:
              h = hashlib.sha256((b / a["name"]).read_bytes()).hexdigest()
              assert h == a["sha256"], f"HASH_MISMATCH {a['name']}"
          print("BUNDLE_OK", [a["name"] for a in m["assets"]])
          PY
      - name: Preparation (system libraries, Blender 4.3.2 verified by the official sha256)
        run: |
          t0=$(date +%s)
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb libegl1 libgl1 libgl1-mesa-dri libglx-mesa0 libxi6 libxxf86vm1 \
            libxfixes3 libxrender1 libxkbcommon0 libsm6 libice6 time ffmpeg >/dev/null
          t1=$(date +%s)
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/blender.tar.xz" "$BLENDER_URL"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/blender.sha256" "$BLENDER_SHA_URL"
          want=$(grep "blender-4.3.2-linux-x64.tar.xz" "$RUNNER_TEMP/blender.sha256" | cut -d' ' -f1)
          echo "$want  $RUNNER_TEMP/blender.tar.xz" | sha256sum -c -
          t2=$(date +%s)
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          t3=$(date +%s)
          echo "BLENDER=$RUNNER_TEMP/blender-4.3.2-linux-x64/blender" >> "$GITHUB_ENV"
          printf '{"apt_s": %d, "download_s": %d, "extract_s": %d, "download_bytes": %d}\n' $((t1-t0)) $((t2-t1)) $((t3-t2)) \
            "$(stat -c %s "$RUNNER_TEMP/blender.tar.xz")" > "$RUNNER_TEMP/prep.json"
          cat "$RUNNER_TEMP/prep.json"; nproc; free -m; df -h "$RUNNER_TEMP" | tail -1
      - name: Graphics context (EGL headless first, then Xvfb + Mesa)
        run: |
          B="migration/production/animation/${{ inputs.project }}/render-bundle"
          mkdir -p "$RUNNER_TEMP/ctx"
          if RENDER_OUT="$RUNNER_TEMP/ctx" timeout 900 "$BLENDER" -b -t 0 --python "$B/production.py" -- master 0 1 > "$RUNNER_TEMP/ctx-egl.log" 2>&1 \
             && [ -f "$RUNNER_TEMP/ctx/hd-frames/00000.png" ]; then
            echo "WRAP=" >> "$GITHUB_ENV"; echo "CONTEXT=egl-headless"
          else
            tail -20 "$RUNNER_TEMP/ctx-egl.log"; rm -rf "$RUNNER_TEMP/ctx"; mkdir -p "$RUNNER_TEMP/ctx"
            RENDER_OUT="$RUNNER_TEMP/ctx" timeout 900 xvfb-run -a -s "-screen 0 1920x1080x24" "$BLENDER" -b -t 0 --python "$B/production.py" -- master 0 1 > "$RUNNER_TEMP/ctx-xvfb.log" 2>&1 || true
            test -f "$RUNNER_TEMP/ctx/hd-frames/00000.png" || { tail -40 "$RUNNER_TEMP/ctx-xvfb.log"; echo "NO_GRAPHICS_CONTEXT"; exit 1; }
            echo 'WRAP=xvfb-run -a -s "-screen 0 1920x1080x24"' >> "$GITHUB_ENV"; echo "CONTEXT=xvfb-mesa"
          fi
          grep -iE "GPU|OpenGL|renderer|Mesa|llvmpipe|EGL" "$RUNNER_TEMP"/ctx-*.log | head -8 || true
      - name: Master join test (two consecutive chunks, separate processes), measured
        run: |
          B="migration/production/animation/${{ inputs.project }}/render-bundle"
          S=${{ inputs.master_start }}; N=${{ inputs.frames }}; O="$RUNNER_TEMP/out"; mkdir -p "$O"
          for k in 0 1; do
            a=$((S + k*N)); b=$((a + N))
            t0=$(date +%s.%N)
            RENDER_OUT="$O" /usr/bin/time -v -o "$RUNNER_TEMP/time-master-$k.txt" bash -c "$WRAP \"$BLENDER\" -b -t 0 --python \"$B/production.py\" -- master $a $b" > "$RUNNER_TEMP/master-$k.log" 2>&1
            t1=$(date +%s.%N)
            echo "{\"chunk\": $k, \"start\": $a, \"end\": $b, \"wall_s\": $(echo "$t1 - $t0" | bc)}" >> "$RUNNER_TEMP/chunks.jsonl"
          done
          cat "$RUNNER_TEMP/chunks.jsonl"; grep -E "Maximum resident|Elapsed" "$RUNNER_TEMP"/time-master-*.txt
      - name: Vertical native test, measured
        run: |
          B="migration/production/animation/${{ inputs.project }}/render-bundle"
          S=${{ inputs.vertical_start }}; N=${{ inputs.frames }}; O="$RUNNER_TEMP/out"
          t0=$(date +%s.%N)
          RENDER_OUT="$O" /usr/bin/time -v -o "$RUNNER_TEMP/time-vertical.txt" bash -c "$WRAP \"$BLENDER\" -b -t 0 --python \"$B/production.py\" -- vertical $S $((S + N))" > "$RUNNER_TEMP/vertical.log" 2>&1
          t1=$(date +%s.%N)
          echo "{\"chunk\": \"vertical\", \"start\": $S, \"end\": $((S + N)), \"wall_s\": $(echo "$t1 - $t0" | bc)}" >> "$RUNNER_TEMP/chunks.jsonl"
          grep -E "Maximum resident|Elapsed" "$RUNNER_TEMP/time-vertical.txt"
      - name: Verify frames, join, determinism; write metrics
        run: |
          O="$RUNNER_TEMP/out"; S=${{ inputs.master_start }}; N=${{ inputs.frames }}
          python3 -I - "$O" "$S" "$N" "$RUNNER_TEMP" <<'PY'
          import json, struct, sys, hashlib
          from pathlib import Path
          o, s, n, tmp = Path(sys.argv[1]), int(sys.argv[2]), int(sys.argv[3]), Path(sys.argv[4])
          def dims(p):
              b = p.read_bytes()[:24]; assert b[:8] == b"\x89PNG\r\n\x1a\n", f"NOT_PNG {p}"
              return struct.unpack(">II", b[16:24])
          master = sorted((o / "hd-frames").glob("*.png")); vert = sorted((o / "vertical-frames").glob("*.png"))
          want = [f"{f:05d}.png" for f in range(s, s + 2 * n)]
          problems = []
          if [p.name for p in master] != want: problems.append(f"MASTER_SET {[p.name for p in master]}")
          problems += [f"MASTER_DIMS {p.name} {dims(p)}" for p in master if dims(p) != (1920, 1080)]
          problems += [f"VERTICAL_DIMS {p.name} {dims(p)}" for p in vert if dims(p) != (1080, 1920)]
          if len(vert) != n: problems.append(f"VERTICAL_COUNT {len(vert)}")
          hashes = [hashlib.sha256(p.read_bytes()).hexdigest()[:12] for p in master]
          chunks = [json.loads(l) for l in (tmp / "chunks.jsonl").read_text().splitlines()]
          def rss(name):
              for l in (tmp / name).read_text().splitlines():
                  if "Maximum resident" in l: return int(l.split()[-1]) // 1024
          out = {"problems": problems, "context": None, "prep": json.loads((tmp / "prep.json").read_text()),
                 "chunks": chunks,
                 "seconds_per_frame_master": [round(c["wall_s"] / n, 2) for c in chunks if c["chunk"] in (0, 1)],
                 "seconds_per_frame_vertical": [round(c["wall_s"] / n, 2) for c in chunks if c["chunk"] == "vertical"],
                 "max_rss_mb": {"master0": rss("time-master-0.txt"), "master1": rss("time-master-1.txt"), "vertical": rss("time-vertical.txt")},
                 "frame_bytes_master_avg": sum(p.stat().st_size for p in master) // max(len(master), 1),
                 "frame_bytes_vertical_avg": sum(p.stat().st_size for p in vert) // max(len(vert), 1),
                 "distinct_consecutive_master_frames": sum(1 for a, b in zip(hashes, hashes[1:]) if a != b),
                 "master_hashes": hashes}
          (tmp / "metrics.json").write_text(json.dumps(out, indent=1))
          print(json.dumps(out, indent=1))
          sys.exit(1 if problems else 0)
          PY
          # join: the two chunks as one 10 fps clip, decoded end to end
          ffmpeg -v error -framerate 10 -start_number $S -i "$O/hd-frames/%05d.png" -c:v libx264 -pix_fmt yuv420p "$RUNNER_TEMP/join.mp4"
          n=$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$RUNNER_TEMP/join.mp4")
          echo "JOIN_FRAMES=$n (want $((2 * N)))"; test "$n" = "$((2 * N))"
          du -sh "$O"; df -h "$RUNNER_TEMP" | tail -1
      - name: Keep the evidence (3 days)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: animation-render-test-${{ github.run_id }}
          retention-days: 3
          path: |
            ${{ runner.temp }}/metrics.json
            ${{ runner.temp }}/prep.json
            ${{ runner.temp }}/chunks.jsonl
            ${{ runner.temp }}/time-*.txt
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/join.mp4
            ${{ runner.temp }}/out/hd-frames/*.png
            ${{ runner.temp }}/out/vertical-frames/*.png
