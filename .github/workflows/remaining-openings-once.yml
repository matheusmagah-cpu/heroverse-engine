name: HeroVerse three explicitly admitted openings
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: heroverse-three-remaining-openings-v1
  cancel-in-progress: false
jobs:
  third_winner:
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.run_number == 1 && github.run_attempt == 1 && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify batch guards offline
        run: python3 -m unittest discover -s migration/diagnostics/rapidapi-native-av -p test_remaining_openings.py -v
      - name: Install decoder from official Ubuntu packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Acquire this source once
        env:
          HERO_RAPIDAPI_KEY: ${{ secrets.HERO_RAPIDAPI_KEY }}
          GH_ARTIFACT_TOKEN: ${{ github.token }}
        run: python3 migration/diagnostics/rapidapi-native-av/remaining_openings.py VA3qvxoZr4Q
      - name: Preserve exact attempt privately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remaining-opening-media-VA3qvxoZr4Q
          path: output/qualification/remaining-openings/VA3qvxoZr4Q
          retention-days: 1
          if-no-files-found: error
      - name: Preserve small chain receipt before successor
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remaining-opening-chain-VA3qvxoZr4Q
          path: output/chain/VA3qvxoZr4Q
          retention-days: 1
          if-no-files-found: error
  median:
    needs: [third_winner]
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.run_number == 1 && github.run_attempt == 1 && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify batch guards offline
        run: python3 -m unittest discover -s migration/diagnostics/rapidapi-native-av -p test_remaining_openings.py -v
      - name: Fetch only predecessor chain receipts from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "remaining-opening-chain-VA3qvxoZr4Q" --dir "output/predecessors/VA3qvxoZr4Q"
      - name: Install decoder from official Ubuntu packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Acquire this source once
        env:
          HERO_RAPIDAPI_KEY: ${{ secrets.HERO_RAPIDAPI_KEY }}
          GH_ARTIFACT_TOKEN: ${{ github.token }}
        run: python3 migration/diagnostics/rapidapi-native-av/remaining_openings.py EkT0XMVln3s
      - name: Preserve exact attempt privately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remaining-opening-media-EkT0XMVln3s
          path: output/qualification/remaining-openings/EkT0XMVln3s
          retention-days: 1
          if-no-files-found: error
      - name: Preserve small chain receipt before successor
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remaining-opening-chain-EkT0XMVln3s
          path: output/chain/EkT0XMVln3s
          retention-days: 1
          if-no-files-found: error
  weak:
    needs: [third_winner, median]
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.run_number == 1 && github.run_attempt == 1 && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify batch guards offline
        run: python3 -m unittest discover -s migration/diagnostics/rapidapi-native-av -p test_remaining_openings.py -v
      - name: Fetch only predecessor chain receipts from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "remaining-opening-chain-VA3qvxoZr4Q" --dir "output/predecessors/VA3qvxoZr4Q"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "remaining-opening-chain-EkT0XMVln3s" --dir "output/predecessors/EkT0XMVln3s"
      - name: Install decoder from official Ubuntu packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Acquire this source once
        env:
          HERO_RAPIDAPI_KEY: ${{ secrets.HERO_RAPIDAPI_KEY }}
          GH_ARTIFACT_TOKEN: ${{ github.token }}
        run: python3 migration/diagnostics/rapidapi-native-av/remaining_openings.py ksMAEHpzkZo
      - name: Preserve exact attempt privately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remaining-opening-media-ksMAEHpzkZo
          path: output/qualification/remaining-openings/ksMAEHpzkZo
          retention-days: 1
          if-no-files-found: error
      - name: Preserve small chain receipt before successor
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remaining-opening-chain-ksMAEHpzkZo
          path: output/chain/ksMAEHpzkZo
          retention-days: 1
          if-no-files-found: error
