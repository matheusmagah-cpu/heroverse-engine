name: HeroVerse pilot render and QA
on:
  workflow_dispatch:
    inputs:
      pilot:
        description: Pilot directory under migration/production (e.g. pilot-001)
        required: true
permissions:
  contents: write
concurrency:
  group: heroverse-pilot-render
  cancel-in-progress: false
jobs:
  render:
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.event.repository.private == true && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.0.0-cloud-assets-20261013
      PILOT: ${{ inputs.pilot }}
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Tools and pinned runtimes
        run: |
          case "$PILOT" in pilot-[0-9][0-9][0-9]) ;; *) echo "INVALID_PILOT"; exit 1;; esac
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core
          python3 -m venv "$RUNNER_TEMP/voice"
          "$RUNNER_TEMP/voice/bin/pip" install --disable-pip-version-check -q 'kokoro-onnx==0.4.9' 'onnxruntime==1.20.1' 'numpy==2.2.6' 'espeakng-loader==0.2.4' 'soundfile==0.13.1'
          python3 -m venv "$RUNNER_TEMP/qa"
          "$RUNNER_TEMP/qa/bin/pip" install --disable-pip-version-check -q ai-edge-litert==2.3.0 faster-whisper==1.2.1
      - name: Verified source and pinned voice model
        run: python3 -I -B migration/production/pilot_render.py prepare "$RUNNER_TEMP/work" HeroVerse_Linux_Source_Ready_20261013_v2.zip
      - name: Narration with the original voice adapter
        run: '"$RUNNER_TEMP/voice/bin/python" -I -B migration/production/pilot_render.py voice "$RUNNER_TEMP/work" "migration/production/$PILOT/script.json"'
      - name: Owned music and Creative Commons clips from the private release
        run: |
          mkdir -p "$RUNNER_TEMP/in/clips" && cd "$RUNNER_TEMP/in"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern original-rest-music.lossless.flac
          echo "1a90714dce83ce5919230a420f56cd17d81d82437303b360244d0fe0f22bbd0c  original-rest-music.lossless.flac" | sha256sum -c -
          cd "$GITHUB_WORKSPACE"
          python3 -I - > "$RUNNER_TEMP/in/assets.txt" <<'PY'
          import json, pathlib
          catalog = {c["video_id"] for c in json.loads(pathlib.Path("migration/production/catalog/cc-visual-catalog.json").read_text())["catalog"]}
          for path in sorted(pathlib.Path("migration/acquisition/receipts").glob("*.json")):
              r = json.loads(path.read_text())
              if r.get("status") == "WINDOW_RECEIVED_AND_DECODED" and r.get("release_asset") and r.get("video_id") in catalog:
                  print(r["release_asset"], r["media_file"]["sha256"])
          PY
          while read -r asset sha; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$RUNNER_TEMP/in/clips"
            echo "$sha  $RUNNER_TEMP/in/clips/$asset" | sha256sum -c -
          done < "$RUNNER_TEMP/in/assets.txt"
          ls "$RUNNER_TEMP/in/clips" | wc -l
      - name: Assemble
        run: python3 -I -B migration/production/pilot_render.py assemble "$RUNNER_TEMP/work" "migration/production/$PILOT/script.json" migration/production/catalog/cc-visual-catalog.json "$RUNNER_TEMP/in/original-rest-music.lossless.flac" "$RUNNER_TEMP"/in/clips/*.mp4
      - name: QA against frozen criteria
        id: qa
        run: |
          mkdir -p "$RUNNER_TEMP/models" && cd "$RUNNER_TEMP/models"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'yamnet-classification-tflite-v1-sha256-*.tflite' -O yamnet.tflite
          echo "10c95ea3eb9a7bb4cb8bddf6feb023250381008177ac162ce169694d05c317de  yamnet.tflite" | sha256sum -c -
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern HeroVerse_ASR_base_en_preservado.zip
          echo "78634f845a29c523d117a29a1a14b293220787f5ede2c6c0f33a9b06c2f805cb  HeroVerse_ASR_base_en_preservado.zip" | sha256sum -c -
          "$RUNNER_TEMP/qa/bin/python" -I -c "import sys; from pathlib import Path; sys.path.insert(0, '$GITHUB_WORKSPACE/migration'); import second_opening_asr as a; a.extract_model(Path('HeroVerse_ASR_base_en_preservado.zip'), Path('whisper'))"
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/qa/bin/python" -I -B migration/production/qa_pilot.py "$RUNNER_TEMP/work/pilot.mp4" "$RUNNER_TEMP/work/manifest.json" \
            "migration/production/$PILOT/script.json" "migration/production/$PILOT/qa_criteria.json" \
            "$RUNNER_TEMP/models/yamnet.tflite" "$RUNNER_TEMP/models/whisper" "$RUNNER_TEMP/work/qa.json" || echo "QA_FAILED=1" >> "$GITHUB_ENV"
      - name: Package (no upload to YouTube)
        run: python3 -I -B migration/production/package_pilot.py "$RUNNER_TEMP/work" "migration/production/$PILOT/script.json" "$RUNNER_TEMP/work/package"
      - name: Preserve render privately and record evidence
        if: always()
        run: |
          sha=$(sha256sum "$RUNNER_TEMP/work/pilot.mp4" | cut -d' ' -f1)
          cp "$RUNNER_TEMP/work/pilot.mp4" "$RUNNER_TEMP/$PILOT-sha256-$sha.mp4"
          cp "$RUNNER_TEMP/work/package/thumbnail.jpg" "$RUNNER_TEMP/$PILOT-thumbnail.jpg" || true
          gh release upload "$TAG" "$RUNNER_TEMP/$PILOT-sha256-$sha.mp4" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$TAG" "$RUNNER_TEMP/$PILOT-thumbnail.jpg" --repo "$GITHUB_REPOSITORY" --clobber || true
          mkdir -p "migration/production/$PILOT/out"
          python3 -I -c "import json,sys; m=json.load(open(sys.argv[1])); [s.pop('file', None) for s in m['shots']]; json.dump(m, open(sys.argv[2],'w'), indent=1, ensure_ascii=False)" "$RUNNER_TEMP/work/manifest.json" "migration/production/$PILOT/out/manifest.json"
          cp "$RUNNER_TEMP/work/qa.json" "migration/production/$PILOT/out/qa.json" || true
          cp "$RUNNER_TEMP/work/package/package.json" "migration/production/$PILOT/out/package.json" || true
          cp "$RUNNER_TEMP/work/timeline.json" "migration/production/$PILOT/out/timeline.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "migration/production/$PILOT/out"
          git commit -q -m "Record $PILOT render, QA and package (run $GITHUB_RUN_ID; not published)"
          git pull --rebase -q origin main && git push -q origin HEAD:main
          test -z "${QA_FAILED:-}"
