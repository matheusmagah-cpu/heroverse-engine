name: HeroVerse isolated reviewer qualification

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Check only, or reserve one native Interactions review of the preserved Short 006
        required: true
        default: check
        type: choice
        options: [check, review, inline, stable]

permissions:
  contents: read
  actions: read

concurrency:
  group: heroverse-reviewer-qualification
  cancel-in-progress: false

jobs:
  qualify:
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate the current key, free project, recorded QA and exact asset
        env:
          HERO_GEMINI_API_KEY: ${{ secrets.HERO_GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
        run: python3 -I -B migration/production/reviewer_qualification.py prepare "$RUNNER_TEMP/reviewer-qualification" "$MODE"
      - name: Reserve this qualification before the provider effect
        if: inputs.mode == 'review' || inputs.mode == 'inline' || inputs.mode == 'stable'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewer-qualification-start-${{ inputs.mode == 'stable' && 'short006-20261022-stable-inline-v1' || inputs.mode == 'inline' && 'short006-20261022-inline-diagnosis-v1' || 'short006-20261022-interactions-v1' }}
          path: ${{ runner.temp }}/reviewer-qualification/receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Review the complete preserved MP4 with audio once
        if: inputs.mode == 'review' || inputs.mode == 'inline' || inputs.mode == 'stable'
        env:
          HERO_GEMINI_API_KEY: ${{ secrets.HERO_GEMINI_API_KEY }}
        run: python3 -I -B migration/production/reviewer_qualification.py infer "$RUNNER_TEMP/reviewer-qualification"
      - name: Preserve the isolated result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewer-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reviewer-qualification/receipt.json
          if-no-files-found: error
          retention-days: 7
