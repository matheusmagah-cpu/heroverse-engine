name: HeroVerse Linux overlay qualification
on:
  push:
    paths:
      - 'migration/qualify_linux_overlay_cloud.py'
      - 'migration/apply_linux_production_overlay.py'
      - '.github/workflows/linux-overlay-qualification.yml'
permissions:
  contents: read
concurrency:
  group: heroverse-linux-overlay-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install isolated fixture runtime and OS font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core ffmpeg
          python3 -m venv "$RUNNER_TEMP/overlay-venv"
          "$RUNNER_TEMP/overlay-venv/bin/python" -m pip install --disable-pip-version-check jsonschema==4.26.0 numpy==2.2.6 Pillow==11.3.0 soundfile==0.13.1
      - name: Verify immutable preimages and original scope/residency fixtures
        run: '"$RUNNER_TEMP/overlay-venv/bin/python" migration/qualify_linux_overlay_cloud.py'
