name: HeroVerse Shorts watched review (private, engine Gemini key)
# Runs the watched review for Shorts rendered elsewhere (e.g. the public runner, which holds no Gemini key)
# and records shorts.json with the publish flags. Every Gemini step stays in this private repo.
on:
  workflow_dispatch:
    inputs:
      pilot:
        description: Pilot directory (e.g. pilot-002)
        required: true
permissions:
  contents: write
concurrency:
  group: heroverse-shorts-review
  cancel-in-progress: false
jobs:
  review:
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.0.0-cloud-assets-20261013
      PILOT: ${{ inputs.pilot }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Qualified long prerequisite
        run: |
          case "$PILOT" in pilot-[0-9][0-9][0-9]) ;; *) exit 1;; esac
          python3 -I -B migration/publish/shorts_prerequisite.py "migration/production/$PILOT"
      - name: Shorts from the private release (hash-verified)
        run: |
          set -euo pipefail
          case "$PILOT" in pilot-[0-9][0-9][0-9]) ;; *) exit 1;; esac
          sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null
          d="migration/production/$PILOT/shorts"
          if [ "$PILOT" = pilot-006 ]; then
            python3 -I -B migration/production/shorts_006_plan.py --http-recovery-list "migration/production/$PILOT"
          else
            python3 -I -c "import json,sys;[print(s['file'],s['sha256']) for s in json.load(open(sys.argv[1]))['shorts']]" "$d/shorts.json"
          fi |
          while read -r f sha; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$PILOT-${f%.mp4}-sha256-$sha.mp4" -O "$d/$f"
            echo "$sha  $d/$f" | sha256sum -c -
          done
      - name: Watched review (Gemini free tier)
        env:
          HERO_GEMINI_API_KEY: ${{ secrets.HERO_GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [ "$PILOT" = pilot-006 ]; then
            python3 -I -B migration/production/shorts_006_plan.py --recover-http-review "migration/production/$PILOT"
          else
            python3 -I -B migration/production/shorts_review.py "migration/production/$PILOT/shorts" 3
          fi
      - name: Record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "migration/production/$PILOT/shorts/shorts.json"
          git commit -q -m "Record $PILOT Shorts watched review (run $GITHUB_RUN_ID)" || exit 0
          for i in 1 2 3 4; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true; sleep $((i * 5))
          done
          exit 1
