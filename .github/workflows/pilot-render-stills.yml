name: HeroVerse pilot render (figure + backgrounds + captions) and QA
run-name: "pilot-render-stills: pilot=${{ inputs.pilot }}"
on:
  workflow_dispatch:
    inputs:
      pilot:
        description: Pilot directory under migration/production (e.g. pilot-002)
        required: true
permissions:
  contents: write
  actions: write
concurrency:
  group: heroverse-pilot-render
  cancel-in-progress: false
jobs:
  render:
    concurrency:   # E116: one run per subject across the guarded workflows
      group: heroverse-subject-${{ inputs.pilot }}
      cancel-in-progress: false
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    env:
      GH_TOKEN: ${{ github.token }}
      PILOT: ${{ inputs.pilot }}
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Dispatch guard (inputs, capacity, one run per subject, no re-run without a fix, imports; E116)
        id: guard
        env:
          GUARD_INPUTS: ${{ toJSON(inputs) }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B migration/ops/dispatch_guard.py run pilot-render-stills.yml
      # the cache key is the venv pin lines of render_pilot.sh only: a new pin is a new cache, nothing older is reused
      - id: pins
        run: echo "hash=$(grep -E '^setup [a-z]+ venv ' migration/ci/render_pilot.sh | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # E102: pip downloads of the render's four venvs are kept between runs (main's cache; the PR smoke reads it)
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.cache/pip
          key: pip-render-${{ runner.os }}-${{ steps.pins.outputs.hash }}
      - name: Render, Shorts, QA, package, record (single script shared with the public execution runner)
        env:
          ENGINE_REPO: ${{ github.repository }}
          HERO_GEMINI_API_KEY: ${{ secrets.HERO_GEMINI_API_KEY }}
          RUN_LABEL: run ${{ github.run_id }}
        run: bash migration/ci/render_pilot.sh
      - name: Approval gates (a push made with this job's token does not start workflows)
        if: success()
        run: gh workflow run approve.yml --repo "$GITHUB_REPOSITORY" --ref main -f pilot="$PILOT"
