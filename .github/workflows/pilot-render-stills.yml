name: HeroVerse pilot render (figure + backgrounds + captions) and QA
on:
  workflow_dispatch:
    inputs:
      pilot:
        description: Pilot directory under migration/production (e.g. pilot-002)
        required: true
permissions:
  contents: write
concurrency:
  group: heroverse-pilot-render
  cancel-in-progress: false
jobs:
  render:
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.event.repository.private == true && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.0.0-cloud-assets-20261013
      PILOT: ${{ inputs.pilot }}
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Tools and pinned runtimes
        run: |
          case "$PILOT" in pilot-[0-9][0-9][0-9]) ;; *) echo "INVALID_PILOT"; exit 1;; esac
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core
          python3 -m venv "$RUNNER_TEMP/voice"
          "$RUNNER_TEMP/voice/bin/pip" install --disable-pip-version-check -q 'kokoro-onnx==0.4.9' 'onnxruntime==1.20.1' 'numpy==2.2.6' 'espeakng-loader==0.2.4' 'soundfile==0.13.1'
          python3 -m venv "$RUNNER_TEMP/qa"
          "$RUNNER_TEMP/qa/bin/pip" install --disable-pip-version-check -q ai-edge-litert==2.3.0 faster-whisper==1.2.1
          python3 -m venv "$RUNNER_TEMP/cut"
          "$RUNNER_TEMP/cut/bin/pip" install --disable-pip-version-check -q 'rembg==2.0.59' 'onnxruntime==1.20.1' 'pillow==11.0.0'
      - name: Verified source and pinned voice model
        run: python3 -I -B migration/production/pilot_render.py prepare "$RUNNER_TEMP/work" HeroVerse_Linux_Source_Ready_20261013_v2.zip
      - name: Narration with the original voice adapter
        run: '"$RUNNER_TEMP/voice/bin/python" -I -B migration/production/pilot_render.py voice "$RUNNER_TEMP/work" "migration/production/$PILOT/script.json"'
      - name: Owned music and generated images from the private release
        run: |
          mkdir -p "$RUNNER_TEMP/in/img" && cd "$RUNNER_TEMP/in"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern original-rest-music.lossless.flac
          echo "1a90714dce83ce5919230a420f56cd17d81d82437303b360244d0fe0f22bbd0c  original-rest-music.lossless.flac" | sha256sum -c -
          cd "$GITHUB_WORKSPACE"
          for meta in migration/production/$PILOT/images/*.json; do
            id=$(basename "$meta" .json)
            read -r asset sha < <(python3 -I -c "import json,sys;m=json.load(open(sys.argv[1]));print(m['release_asset'],m['sha256'])" "$meta")
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" -O "$RUNNER_TEMP/in/img/$id.png"
            echo "$sha  $RUNNER_TEMP/in/img/$id.png" | sha256sum -c -
            cp "$meta" "$RUNNER_TEMP/in/img/$id.json"
          done
      - name: Figure cut-out
        run: |
          fig=$(python3 -I -c "import json,sys;print(json.load(open(sys.argv[1]))['figure'])" "migration/production/$PILOT/script.json")
          "$RUNNER_TEMP/cut/bin/python" -I -B migration/production/imagegen/cutout.py "$RUNNER_TEMP/in/img/$fig.png" "$RUNNER_TEMP/in/img/$fig.json" "$RUNNER_TEMP/in/figure.png"
      - name: Assemble
        run: python3 -I -B migration/production/still_render.py assemble "$RUNNER_TEMP/work" "migration/production/$PILOT/script.json" "$RUNNER_TEMP/in/img" "$RUNNER_TEMP/in/figure.png" "$RUNNER_TEMP/in/original-rest-music.lossless.flac"
      - name: Shorts (vertical, sentence-exact, from the same sources)
        run: python3 -I -B migration/production/shorts_cut.py "$RUNNER_TEMP/work" "migration/production/$PILOT/script.json" "$RUNNER_TEMP/in/img" "$RUNNER_TEMP/in/figure.png" "$RUNNER_TEMP/in/original-rest-music.lossless.flac" "$RUNNER_TEMP/work/shorts" 3
      - name: QA against frozen criteria
        run: |
          mkdir -p "$RUNNER_TEMP/models" && cd "$RUNNER_TEMP/models"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'yamnet-classification-tflite-v1-sha256-*.tflite' -O yamnet.tflite
          echo "10c95ea3eb9a7bb4cb8bddf6feb023250381008177ac162ce169694d05c317de  yamnet.tflite" | sha256sum -c -
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern HeroVerse_ASR_base_en_preservado.zip
          echo "78634f845a29c523d117a29a1a14b293220787f5ede2c6c0f33a9b06c2f805cb  HeroVerse_ASR_base_en_preservado.zip" | sha256sum -c -
          "$RUNNER_TEMP/qa/bin/python" -I -c "import sys; from pathlib import Path; sys.path.insert(0, '$GITHUB_WORKSPACE/migration'); import second_opening_asr as a; a.extract_model(Path('HeroVerse_ASR_base_en_preservado.zip'), Path('whisper'))"
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/qa/bin/python" -I -B migration/production/qa_pilot.py "$RUNNER_TEMP/work/pilot.mp4" "$RUNNER_TEMP/work/manifest.json" \
            "migration/production/$PILOT/script.json" "migration/production/$PILOT/qa_criteria.json" \
            "$RUNNER_TEMP/models/yamnet.tflite" "$RUNNER_TEMP/models/whisper" "$RUNNER_TEMP/work/qa.json" || echo "QA_FAILED=1" >> "$GITHUB_ENV"
      - name: Package (no upload to YouTube) and inspection sheet
        run: |
          python3 -I -B migration/production/package_pilot.py "$RUNNER_TEMP/work" "migration/production/$PILOT/script.json" "$RUNNER_TEMP/work/package"
          mkdir -p "migration/production/$PILOT/inspection"
          d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$RUNNER_TEMP/work/pilot.mp4")
          n=$(python3 -c "import math;print(math.ceil($d/20))")
          ffmpeg -v error -y -i "$RUNNER_TEMP/work/pilot.mp4" -vf "fps=1/20,scale=480:270,tile=4x$(( (n + 3) / 4 ))" -frames:v 1 -q:v 4 "migration/production/$PILOT/inspection/pilot-contact-sheet.jpg"
          ffmpeg -v error -y -ss 0 -t 40 -i "$RUNNER_TEMP/work/pilot.mp4" -vf "fps=1/2.5,scale=480:270,tile=4x4" -frames:v 1 -q:v 4 "migration/production/$PILOT/inspection/opening-sheet.jpg"
          cp "$RUNNER_TEMP/in/figure.png" "$RUNNER_TEMP/figure-preview.png"
          ffmpeg -v error -y -i "$RUNNER_TEMP/in/figure.png" -vf "scale=-1:540,pad=iw+40:ih+40:20:20:color=0x808080" "migration/production/$PILOT/inspection/figure-cutout.jpg"
      - name: Preserve render privately and record evidence
        if: always()
        run: |
          sha=$(sha256sum "$RUNNER_TEMP/work/pilot.mp4" | cut -d' ' -f1)
          cp "$RUNNER_TEMP/work/pilot.mp4" "$RUNNER_TEMP/$PILOT-sha256-$sha.mp4"
          cp "$RUNNER_TEMP/work/package/thumbnail.jpg" "$RUNNER_TEMP/$PILOT-thumbnail.jpg" || true
          gh release upload "$TAG" "$RUNNER_TEMP/$PILOT-sha256-$sha.mp4" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$TAG" "$RUNNER_TEMP/$PILOT-thumbnail.jpg" --repo "$GITHUB_REPOSITORY" --clobber || true
          mkdir -p "migration/production/$PILOT/out"
          cp "$RUNNER_TEMP/work/manifest.json" "$RUNNER_TEMP/work/timeline.json" "$RUNNER_TEMP/work/captions.ass" "migration/production/$PILOT/out/"
          cp "$RUNNER_TEMP/work/qa.json" "migration/production/$PILOT/out/qa.json" || true
          cp "$RUNNER_TEMP/work/package/package.json" "migration/production/$PILOT/out/package.json" || true
          cp "$RUNNER_TEMP/work/package/thumbnail.jpg" "migration/production/$PILOT/inspection/thumbnail.jpg" || true
          mkdir -p "migration/production/$PILOT/shorts"
          cp "$RUNNER_TEMP/work/shorts/shorts.json" "migration/production/$PILOT/shorts/" || true
          for s in "$RUNNER_TEMP"/work/shorts/short-*.mp4; do
            [ -f "$s" ] || continue
            ssha=$(sha256sum "$s" | cut -d' ' -f1); n=$(basename "$s" .mp4)
            cp "$s" "$RUNNER_TEMP/$PILOT-$n-sha256-$ssha.mp4"
            gh release upload "$TAG" "$RUNNER_TEMP/$PILOT-$n-sha256-$ssha.mp4" --repo "$GITHUB_REPOSITORY" --clobber
            ffmpeg -v error -y -ss 3 -i "$s" -frames:v 1 -vf scale=360:-1 "migration/production/$PILOT/shorts/$n-frame.jpg" || true
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "migration/production/$PILOT/out" "migration/production/$PILOT/inspection" "migration/production/$PILOT/shorts"
          git commit -q -m "Record $PILOT render, QA, package and inspection sheets (run $GITHUB_RUN_ID; not published)"
          git pull --rebase -q origin main && git push -q origin HEAD:main
          test -z "${QA_FAILED:-}"
