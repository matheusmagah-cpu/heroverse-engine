name: HeroVerse images on Cloudflare Workers AI (free allocation)
on:
  workflow_dispatch:
    inputs:
      pilot:
        description: Pilot directory with images.json
        required: true
      engine:
        description: flux (FLUX.1 schnell, square) or sdxl (SDXL-Lightning, 16:9)
        required: true
        default: flux
      only:
        description: Optional comma-separated image ids; empty = all
        required: false
        default: ''
permissions:
  contents: write
jobs:
  images:
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.0.0-cloud-assets-20261013
      PILOT: ${{ inputs.pilot }}
      ENGINE: ${{ inputs.engine }}
      ONLY: ${{ inputs.only }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'a6384d28432b16b02970b4ffe92731ce' }}  # account id is an identifier, not a credential
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Generate
        run: |
          case "$PILOT" in pilot-[0-9][0-9][0-9]) ;; *) exit 1;; esac
          case "$ENGINE" in flux|sdxl) ;; *) exit 1;; esac
          test -n "$CLOUDFLARE_API_TOKEN" || { echo CLOUDFLARE_API_TOKEN_MISSING; exit 1; }  # account id: secret, else resolved from the token
          python3 -m venv "$RUNNER_TEMP/v" && "$RUNNER_TEMP/v/bin/pip" install -q --disable-pip-version-check pillow==11.0.0
          "$RUNNER_TEMP/v/bin/python" -I -B migration/production/imagegen/cf_images.py "migration/production/$PILOT/images.json" "$RUNNER_TEMP/img" "$ENGINE"
      - name: 2x super-resolution on CPU (Real-ESRGAN general x4v3 compact, BSD-3; FLUX outputs are 1024 square)
        if: inputs.engine == 'flux'
        run: |
          python3 -m venv "$RUNNER_TEMP/up"
          "$RUNNER_TEMP/up/bin/pip" install -q --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          "$RUNNER_TEMP/up/bin/pip" install -q --disable-pip-version-check spandrel==0.4.1 pillow==11.0.0 numpy==2.2.6
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/realesr-general-x4v3.pth" https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-x4v3.pth
          echo "8dc7edb9ac80ccdc30c3a5dca6616509367f05fbc184ad95b731f05bece96292  $RUNNER_TEMP/realesr-general-x4v3.pth" | sha256sum -c -
          "$RUNNER_TEMP/up/bin/python" -I -B migration/production/imagegen/upscale.py "$RUNNER_TEMP/realesr-general-x4v3.pth" "$RUNNER_TEMP"/img/*.png
      - name: Release assets, metadata and review sheet
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          dest="migration/production/$PILOT/images"; mkdir -p "$dest" "$RUNNER_TEMP/sheet"
          cd "$RUNNER_TEMP/img"
          for png in *.png; do
            id="${png%.png}"; sha=$(sha256sum "$png" | cut -d' ' -f1)
            asset="$PILOT-img-$id-sha256-$sha.png"; cp "$png" "$RUNNER_TEMP/sheet/$png"; cp "$png" "$asset"
            gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
            python3 -I -c "import json,sys;m=json.load(open(sys.argv[1]));m['release_asset']=sys.argv[2];m['sha256']=sys.argv[3];open(sys.argv[4],'w').write(json.dumps(m,indent=1)+'\n')" "$id.json" "$asset" "$sha" "$GITHUB_WORKSPACE/$dest/$id.json"
          done
          n=$(ls "$RUNNER_TEMP"/sheet/*.png | wc -l)
          ffmpeg -v error -y -pattern_type glob -i "$RUNNER_TEMP/sheet/*.png" -vf "scale=448:256:force_original_aspect_ratio=decrease,pad=448:256:(ow-iw)/2:(oh-ih)/2,tile=4x$(( (n + 3) / 4 ))" -frames:v 1 -q:v 4 "$GITHUB_WORKSPACE/$dest/review-sheet-cf.jpg"
          for png in "$RUNNER_TEMP"/sheet/*.png; do  # 100% detail crops (centre 640x360) to judge sharpness
            ffmpeg -v error -y -i "$png" -vf "crop=640:360" "$RUNNER_TEMP/sheet/$(basename "$png" .png).detail.jpg"; done
          ffmpeg -v error -y -pattern_type glob -i "$RUNNER_TEMP/sheet/*.detail.jpg" -vf "tile=2x$(( (n + 1) / 2 ))" -frames:v 1 -q:v 3 "$GITHUB_WORKSPACE/$dest/detail-sheet-cf.jpg"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          git commit -q -m "Record $PILOT images from Cloudflare Workers AI ($ENGINE, run $GITHUB_RUN_ID)"
          git pull --rebase -q origin main && git push -q origin HEAD:main
