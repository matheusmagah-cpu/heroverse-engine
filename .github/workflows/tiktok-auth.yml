name: HeroVerse TikTok authorization (one time; stores the refresh token as a secret)
on:
  workflow_dispatch:
    inputs:
      action:
        description: "url = print the consent link; exchange = store the access from the one-time code"
        required: true
        default: url
        type: choice
        options: [url, exchange]
      code:
        description: One-time code shown by tiktok-callback.html (exchange only; expires in minutes, works once)
        required: false
permissions:
  contents: read
jobs:
  auth:
    if: github.repository == 'matheusmagah-cpu/heroverse-engine'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ACTION: ${{ inputs.action }}
      TIKTOK_CODE: ${{ inputs.code }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Authorize
        run: |
          [ -n "$TIKTOK_CODE" ] && echo "::add-mask::$TIKTOK_CODE"
          case "$ACTION" in url|exchange) ;; *) echo INVALID_ACTION; exit 1;; esac
          [ -n "$TIKTOK_CLIENT_KEY" ] && [ -n "$TIKTOK_CLIENT_SECRET" ] || { echo "TIKTOK_APP_SECRETS_MISSING"; exit 1; }
          python3 -I -B migration/publish/tiktok_auth.py "$ACTION"
