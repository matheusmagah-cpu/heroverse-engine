name: HeroVerse mining accuracy (native audio vs model-reported mining)
# Daily 00:20 UTC (after the acquisition day resets): up to 12 holdout windows (videos never used before) of the latest structure mining are acquired
# from the original audio (acquire-reference-window.yml). When their profiles (our own ASR) are recorded, the
# mined transcripts and opening words are compared with them and accuracy.json is written.
on:
  # scheduled by heartbeat.yml (migration/ops/heartbeat.py), the engine's only scheduler
  push:
    branches: [main]
    paths: ['migration/acquisition/profiles/**']
  workflow_dispatch:
    inputs:
      mode:
        description: request (acquire windows) or compare (profiles recorded)
        required: false
        default: request
permissions:
  contents: write
  actions: write
concurrency:
  group: heroverse-mining-accuracy
  cancel-in-progress: false
jobs:
  accuracy:
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.event.repository.private == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Request native windows of the latest structure mining (scheduled or manual run)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'compare')
        run: |
          latest=$(ls -d migration/evidence/structure-mining/2* | sort | tail -1)
          windows=$(python3 -I -B migration/mining/accuracy_check.py --pick "$latest" 12)
          [ -n "$windows" ] || { echo "NO_WINDOWS"; exit 0; }
          gh workflow run acquire-reference-window.yml --repo "$GITHUB_REPOSITORY" --ref main -f windows="$windows"
          echo "REQUESTED $latest"
      - name: Compare and record (when profiles arrive)
        if: github.event_name == 'push' || inputs.mode == 'compare'
        run: |
          latest=$(ls -d migration/evidence/structure-mining/2* | sort | tail -1)
          python3 -I -B migration/mining/accuracy_check.py "$latest" migration/acquisition/profiles migration/evidence/mining-accuracy-holdout.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$latest/accuracy.json"
          git commit -q -m "Record mining accuracy for $latest (run $GITHUB_RUN_ID)" || exit 0
          for i in 1 2 3 4; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true; sleep $((i * 5))
          done
          exit 1
