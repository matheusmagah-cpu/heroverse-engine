name: HeroVerse footage library (licensed real footage, no paid call)
on:
  workflow_dispatch:
    inputs:
      per_theme:
        description: Clips to add per query (default 3)
        required: false
        default: '3'
      queries:
        description: Queries file (default the library themes; a story pilot's beats.json mines clips for its words)
        required: false
        default: migration/production/footage/queries.json
permissions:
  contents: write
concurrency:
  group: heroverse-footage
  cancel-in-progress: false
jobs:
  library:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.0.0-cloud-assets-20261013
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'a6384d28432b16b02970b4ffe92731ce' }}  # account id is an identifier, not a credential
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Search, download and normalise (1920x1080, 30 fps, no audio)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg tesseract-ocr python3-pil >/dev/null
          [[ "$QUERIES" =~ ^migration/production/(footage/queries|pilot-[0-9]{3}/beats(-[0-9])?)\.json$ ]] || { echo "QUERIES_PATH_REFUSED"; exit 1; }
          [[ "$PER_THEME" =~ ^[0-9]{1,2}$ ]] || { echo "PER_THEME_REFUSED"; exit 1; }
          python3 -I -B migration/production/footage/footage.py search "$QUERIES" "$RUNNER_TEMP/clips" "$PER_THEME"
        env:
          QUERIES: ${{ inputs.queries || 'migration/production/footage/queries.json' }}
          PER_THEME: ${{ inputs.per_theme || '3' }}
      - name: Release assets, records and frame sheet for vetting
        run: |
          lib=migration/production/footage/library; mkdir -p "$lib/sheets" "$RUNNER_TEMP/frames"
          shopt -s nullglob; n=0
          for mp4 in "$RUNNER_TEMP"/clips/*.mp4; do
            id=$(basename "$mp4" .mp4); sha=$(sha256sum "$mp4" | cut -d' ' -f1)
            v=$(python3 -I -c "import json,sys;print(json.load(open(sys.argv[1]))['vetting'])" "$RUNNER_TEMP/clips/$id.json")
            asset=""
            if [ "$v" != "REJECTED" ]; then  # a rejected clip is recorded (audit) but not stored
              asset="footage-$id-sha256-$sha.mp4"; cp "$mp4" "$RUNNER_TEMP/$asset"
              gh release upload "$TAG" "$RUNNER_TEMP/$asset" --repo "$GITHUB_REPOSITORY" --clobber
            fi
            python3 -I -c "import json,sys;m=json.load(open(sys.argv[1]));m['release_asset']=sys.argv[2] or None;open(sys.argv[3],'w').write(json.dumps(m,indent=1,ensure_ascii=False)+'\n')" "$RUNNER_TEMP/clips/$id.json" "$asset" "$lib/$id.json"
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$mp4")
            for k in 1 2 3; do  # start, middle, end of each kept clip, with its id burned in for the reviewer
              ffmpeg -v error -y -ss "$(python3 -c "print($d*($k*2-1)/6)")" -i "$mp4" -frames:v 1 \
                -vf "scale=480:270,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='$id':x=6:y=6:fontsize=12:fontcolor=yellow:box=1:boxcolor=black@0.6" \
                "$RUNNER_TEMP/frames/$id-$k.jpg"
            done
            n=$((n+1))
          done
          [ "$n" -gt 0 ] || { echo "NO_NEW_CLIPS"; exit 0; }
          ffmpeg -v error -y -pattern_type glob -i "$RUNNER_TEMP/frames/*.jpg" -vf "tile=3x$n" -frames:v 1 -q:v 4 "$lib/sheets/run-$GITHUB_RUN_ID.jpg"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$lib"
          git commit -q -m "Footage library: $n licensed clips with automatic vetting (run $GITHUB_RUN_ID)"
          git pull --rebase -q origin main && git push -q origin HEAD:main
