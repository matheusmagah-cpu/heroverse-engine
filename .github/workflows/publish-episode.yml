name: HeroVerse publish a Bible-series episode (hash-verified, idempotent)
run-name: "publish-episode: episode=${{ inputs.episode }} source_url=${{ inputs.source_url }} publish_at=${{ inputs.publish_at }}"
on:
  workflow_dispatch:
    inputs:
      episode:
        description: Episode id under migration/production/bible/episodes (e.g. genesis-01-short)
        required: true
      source_url:
        description: Download URL of the composed file (its sha256 must equal the episode record); empty = from the release
        required: false
      publish_at:
        description: RFC3339 UTC go-public time; empty = public now
        required: false
permissions:
  actions: read   # E116: the dispatch guard reads runs (read-only)
  contents: write
concurrency:
  group: heroverse-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      EPISODE: ${{ inputs.episode }}
      SOURCE_URL: ${{ inputs.source_url }}
      PUBLISH_AT: ${{ inputs.publish_at }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Dispatch guard (inputs, capacity, one run per subject, no re-run without a fix, imports; E116)
        env:
          GUARD_INPUTS: ${{ toJSON(inputs) }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B migration/ops/dispatch_guard.py run publish-episode.yml
      - name: Publication hold (owner pause, migration/ops/PUBLICATION_HOLD)
        run: |
          if [ -f migration/ops/PUBLICATION_HOLD ]; then cat migration/ops/PUBLICATION_HOLD; echo "PUBLICATION_HOLD"; exit 1; fi
      - name: Fetch the file, verify its hash, keep it in the private release
        run: |
          case "$EPISODE" in *[!a-z0-9-]*|"") echo INVALID_EPISODE; exit 1;; esac
          ep="migration/production/bible/episodes/$EPISODE.json"
          sha=$(python3 -I -c "import json,sys;print(json.load(open(sys.argv[1]))['output_sha256'])" "$ep")
          asset="bible-$EPISODE-sha256-$sha.mp4"
          if bash "$GITHUB_WORKSPACE/migration/ci/assets.sh" download --repo "$GITHUB_REPOSITORY" --pattern "$asset" -O "$RUNNER_TEMP/episode.mp4" 2>/dev/null; then
            echo "FROM_RELEASE $asset"
          else
            curl -sfL --retry 3 -m 600 -o "$RUNNER_TEMP/episode.mp4" "$SOURCE_URL"
          fi
          echo "$sha  $RUNNER_TEMP/episode.mp4" | sha256sum -c -
          cp "$RUNNER_TEMP/episode.mp4" "$RUNNER_TEMP/$asset"
          bash "$GITHUB_WORKSPACE/migration/ci/assets.sh" upload "$RUNNER_TEMP/$asset" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish
        env:
          HERO_YT_AUTHORIZED_USER_JSON: ${{ secrets.HERO_YT_AUTHORIZED_USER_JSON }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check -q google-auth==2.40.3 requests==2.32.4
          mkdir -p migration/publish/receipts
          "$RUNNER_TEMP/venv/bin/python" -I -B migration/publish/publish_episode.py "migration/production/bible/episodes/$EPISODE.json" \
            "$RUNNER_TEMP/episode.mp4" migration/publish/ledger.json "migration/publish/receipts/bible-$EPISODE-$GITHUB_RUN_ID.json" $PUBLISH_AT
      - name: Record ledger and receipt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration/publish/ledger.json migration/publish/receipts
          if ! git diff --cached --quiet; then git commit -q -m "Publish Bible episode $EPISODE (run $GITHUB_RUN_ID)"; fi
          git pull --rebase -q origin main
          git push -q origin HEAD:main
