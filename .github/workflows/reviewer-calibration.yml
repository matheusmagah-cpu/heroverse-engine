name: HeroVerse reviewer calibration (a candidate reviewer against renders the designated reviewer judged)
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Free models to qualify, space separated (each is judged on the same renders)
        required: true
        default: gemini-3.5-flash gemini-3-flash-preview gemini-2.5-flash
      pilots:
        description: Rendered pilots with a designated watched review (space separated)
        required: true
        default: pilot-004 pilot-005 pilot-006 pilot-007 pilot-008 pilot-012
permissions:
  contents: write
concurrency:
  group: heroverse-approve
  cancel-in-progress: false
jobs:
  calibrate:
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.0.0-cloud-assets-20261013
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Unit tests
        run: python3 -I -B migration/production/test_reviewer_calibration.py
      - name: Renders from the private release (hash-verified)
        env:
          PILOTS: ${{ inputs.pilots }}
        run: |
          : > "$RUNNER_TEMP/pairs"
          for p in $PILOTS; do
            sha=$(python3 -I -c "import json,sys;print(json.load(open(sys.argv[1]))['output_sha256'])" "migration/production/$p/out/manifest.json")
            if bash migration/ci/release_video.sh get "$p-sha256-$sha.mp4" "$sha" "$RUNNER_TEMP/$p.mp4"; then
              echo "$p=$RUNNER_TEMP/$p.mp4" >> "$RUNNER_TEMP/pairs"
            else
              # published renders leave the release: judge their public YouTube copy (ledger video_id of this exact render)
              vid=$(python3 -I -c "import json,sys;print(json.load(open('migration/publish/ledger.json'))['entries'][sys.argv[1]+':'+sys.argv[2]]['video_id'])" "$p" "$sha")
              echo "$p=youtube:$vid" >> "$RUNNER_TEMP/pairs"
            fi
          done
      - name: Candidate reviews every render once
        env:
          HERO_GEMINI_API_KEY: ${{ secrets.HERO_GEMINI_API_KEY }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          mkdir -p migration/evidence/reviewer-calibration
          mapfile -t pairs < "$RUNNER_TEMP/pairs"
          for c in $CANDIDATE; do
            python3 -I -B migration/production/reviewer_calibration.py "$c" \
              "migration/evidence/reviewer-calibration/$c-$(date -u +%Y%m%dT%H%M).json" "${pairs[@]}" || echo "CALIBRATION_ERROR $c"
          done
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration/evidence/reviewer-calibration
          git commit -q -m "Record reviewer calibration (run $GITHUB_RUN_ID)"
          git pull --rebase -q origin main && git push -q origin HEAD:main
