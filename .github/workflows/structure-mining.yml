name: HeroVerse full-structure mining (whole videos of winning channels)
on:
  schedule:
    - cron: '30 8 * * *'   # daily and incremental (living intelligence): only new uploads cost Gemini calls
  workflow_dispatch:
    inputs:
      channels:
        description: Comma-separated channel ids (empty = migration/mining/structure_channels.txt)
        required: false
      per_channel:
        description: Best videos by views per channel (the latest upload is always added)
        required: false
        default: '1'
permissions:
  contents: write
concurrency:
  group: heroverse-structure-mining
  cancel-in-progress: false
jobs:
  mine:
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.event.repository.private == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      CHANNELS: ${{ inputs.channels }}
      PER_CHANNEL: ${{ inputs.per_channel }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Unit tests
        run: python3 -I -B migration/mining/test_structure_mining.py
      - name: Mine (Data API metadata and comments; Gemini free tier on the whole public video)
        env:
          HERO_YT_AUTHORIZED_USER_JSON: ${{ secrets.HERO_YT_AUTHORIZED_USER_JSON }}
          HERO_GEMINI_API_KEY: ${{ secrets.HERO_GEMINI_API_KEY }}
        run: |
          [ -n "$CHANNELS" ] || CHANNELS=$(grep -oE '^UC[A-Za-z0-9_-]{22}' migration/mining/structure_channels.txt | paste -sd, -)
          PER_CHANNEL="${PER_CHANNEL:-1}"
          echo "$CHANNELS" | grep -Eq '^UC[A-Za-z0-9_-]{22}(,UC[A-Za-z0-9_-]{22})*$' || { echo INVALID_CHANNELS; exit 1; }
          case "$PER_CHANNEL" in [1-5]) ;; *) echo INVALID_PER_CHANNEL; exit 1;; esac
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check -q google-auth==2.40.3 requests==2.32.4
          day=$(date -u +%Y%m%d); echo "DAY=$day" >> "$GITHUB_ENV"
          out="migration/evidence/structure-mining/$day"; mkdir -p "$out"
          # incremental: start from the previous run's complete records (identical files cost nothing in git)
          prev=$(ls -d migration/evidence/structure-mining/2* 2>/dev/null | grep -v "/$day$" | sort | tail -1)
          [ -n "$prev" ] && [ -z "$(ls "$out"/structure-*.json 2>/dev/null)" ] && cp "$prev"/structure-*.json "$out"/ 2>/dev/null || true
          "$RUNNER_TEMP/venv/bin/python" -I -B migration/mining/structure_mining.py "$out" "$CHANNELS" "$PER_CHANNEL"
      - name: Record
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration/evidence/structure-mining || true
          git commit -q -m "Record full-structure mining $DAY (run $GITHUB_RUN_ID; model-reported, not verified)" || exit 0
          # runs share the day's blueprint.json; on a rebase conflict keep this run's version, retry the push
          for i in 1 2 3 4; do
            git pull --rebase -X theirs -q origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true; sleep $((i * 5))
          done
          exit 1
