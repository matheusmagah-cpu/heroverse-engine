name: HeroVerse pilot preview (opening + every footage clip + thumbnail, before the full render)
run-name: "pilot-preview: pilot=${{ inputs.pilot }}"
# Owner, 2026-10-24: "the structure must already produce only 9.5 and up". A ~15 min preview of the current script is
# reviewed by Claude (ops/CLAUDE_REVIEW.md); the full render (pilot-render-stills.yml) refuses to start without that
# review at the floor (preview_gate.py). Dispatched by the heartbeat from render_queue.py preview.
on:
  workflow_dispatch:
    inputs:
      pilot:
        description: Pilot directory under migration/production (e.g. pilot-008)
        required: true
permissions:
  actions: read   # E116: the dispatch guard reads runs (read-only)
  contents: write
concurrency:
  group: heroverse-pilot-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      ENGINE_REPO: ${{ github.repository }}
      PILOT: ${{ inputs.pilot }}
      PREVIEW: '1'
      RUN_LABEL: preview ${{ github.run_id }}
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Dispatch guard (inputs, capacity, one run per subject, no re-run without a fix, imports; E116)
        env:
          GUARD_INPUTS: ${{ toJSON(inputs) }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B migration/ops/dispatch_guard.py run pilot-preview.yml
      # the cache key is the venv pin lines of render_pilot.sh only: a new pin is a new cache, nothing older is reused
      - id: pins
        run: echo "hash=$(grep -E '^setup [a-z]+ venv ' migration/ci/render_pilot.sh | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # E102: pip downloads of the render's four venvs are kept between runs (main's cache; the PR smoke reads it)
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.cache/pip
          key: pip-render-${{ runner.os }}-${{ steps.pins.outputs.hash }}
      - name: Render the opening, sheet every footage clip, thumbnail; commit for review
        run: bash migration/ci/render_pilot.sh
