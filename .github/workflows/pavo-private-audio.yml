name: HeroVerse private Pavo talking DRAFT
run-name: "pavo-private-audio: plan=${{ inputs.plan }} sha256=${{ inputs.sha256 }}"
on:
  workflow_dispatch:
    inputs:
      plan:
        description: Existing episode subject; this DRAFT does not approve the plan
        required: true
        default: migration/production/bible/plans/genesis-09-short.json
      manifest:
        description: Committed hash-only private audio manifest
        required: true
      sha256:
        description: Canonical manifest request digest
        required: true
      receipt_certificate:
        description: Existing operator public PEM certificate, never a private key
        required: true
      lease_run_id:
        description: Current shared executor lease owner run ID
        required: true
      reconcile_run:
        description: Prior private DRAFT run to read by its saved conversation ID; never resubmits
        required: false
permissions:
  contents: read
  actions: read
jobs:
  talk:
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    concurrency:
      group: heroverse-subject-${{ inputs.plan }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      PRIVATE_AUDIO_INPUTS: ${{ toJSON(inputs) }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
      - name: Dispatch guard and shared quota
        env:
          GUARD_INPUTS: ${{ toJSON(inputs) }}
        run: python3 -I -B migration/ops/dispatch_guard.py run pavo-private-audio.yml
      - name: Durable DRAFT claim before any Pavo mutation
        if: inputs.reconcile_run == ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 -I -B migration/integrations/pavo/private_audio.py claim
      - name: Restore prior conversation ID for GET-only reconciliation
        if: inputs.reconcile_run != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 -I -B migration/integrations/pavo/private_audio.py recover
      - name: Exact zero quote and one private audio upload address
        if: inputs.reconcile_run == ''
        env:
          PAVO_TOKEN: ${{ secrets.PAVO_TOKEN }}
        run: python3 -I -B migration/integrations/pavo/private_audio.py prepare
      - name: Encrypt upload receipt
        if: always()
        run: python3 -I -B migration/integrations/pavo/private_audio.py seal
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.reconcile_run == ''
        with:
          name: pavo-private-upload
          path: ${{ runner.temp }}/pavo-private-audio/receipt.cms
          retention-days: 7
          if-no-files-found: error
      - name: Await exact private WAV transfer and verify PCM
        if: inputs.reconcile_run == ''
        run: python3 -I -B migration/integrations/pavo/private_audio.py ready
      - name: Fresh quote and exactly one existing-adapter generation
        if: inputs.reconcile_run == ''
        env:
          PAVO_TOKEN: ${{ secrets.PAVO_TOKEN }}
        run: python3 -I -B migration/integrations/pavo/private_audio.py submit
      - name: Encrypt submission receipt
        if: always()
        run: python3 -I -B migration/integrations/pavo/private_audio.py seal
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pavo-private-submission
          path: ${{ runner.temp }}/pavo-private-audio/receipt.cms
          retention-days: 7
          if-no-files-found: ignore
      - name: Read same conversation only, no regeneration
        env:
          PAVO_TOKEN: ${{ secrets.PAVO_TOKEN }}
        run: python3 -I -B migration/integrations/pavo/private_audio.py poll
      - name: Encrypt final private evidence
        if: always()
        run: python3 -I -B migration/integrations/pavo/private_audio.py seal
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pavo-private-result
          path: ${{ runner.temp }}/pavo-private-audio/receipt.cms
          retention-days: 7
          if-no-files-found: ignore
