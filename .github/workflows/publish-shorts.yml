name: HeroVerse publish Shorts (cut from a published long video, scheduled slots)
on:
  # scheduled by heartbeat.yml (migration/ops/heartbeat.py), the engine's only scheduler
  workflow_dispatch:
    inputs:
      pilot:
        description: Pilot directory whose long video is already published (e.g. pilot-002); empty = the pending one
        required: false
      slots:
        description: Comma-separated RFC3339 UTC go-public times, one per Short; empty = computed
        required: false
permissions:
  contents: write
concurrency:
  group: heroverse-publish
  cancel-in-progress: false
jobs:
  shorts:
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.0.0-cloud-assets-20261013
      INPUT_PILOT: ${{ inputs.pilot }}
      INPUT_SLOTS: ${{ inputs.slots }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Publication hold (owner pause, migration/ops/PUBLICATION_HOLD)
        run: |
          if [ -f migration/ops/PUBLICATION_HOLD ]; then cat migration/ops/PUBLICATION_HOLD; echo "PUBLICATION_HOLD"; exit 1; fi
      - name: Which pilot and slots
        run: |
          PILOT="$INPUT_PILOT"; SLOTS="$INPUT_SLOTS"
          if [ -z "$PILOT" ] || [ -z "$SLOTS" ]; then
            read -r p s < <(python3 -I -B migration/publish/pending_shorts.py migration/production migration/publish/ledger.json || true)
            PILOT="${PILOT:-$p}"; SLOTS="${SLOTS:-$s}"
          fi
          if [ -z "$PILOT" ]; then echo "NOTHING_PENDING"; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0; fi
          echo "PILOT=$PILOT" >> "$GITHUB_ENV"; echo "SLOTS=$SLOTS" >> "$GITHUB_ENV"
          echo "$PILOT $SLOTS"
      - name: Shorts from the private release (hash-verified)
        if: env.SKIP != '1'
        run: |
          case "$PILOT" in pilot-[0-9][0-9][0-9]) ;; *) exit 1;; esac
          echo "$SLOTS" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z(,[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z)*$' || { echo INVALID_SLOTS; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null
          d="migration/production/$PILOT"; mkdir -p "$RUNNER_TEMP/shorts"
          sha256sum "$d/shorts/shorts.json" | cut -d' ' -f1 > "$RUNNER_TEMP/downloaded-shorts-manifest.sha256"
          python3 -I -B migration/publish/pending_shorts.py --todo "$d" migration/publish/ledger.json |
          while read -r f sha; do
            n="${f%.mp4}"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$PILOT-$n-sha256-$sha.mp4" -O "$RUNNER_TEMP/shorts/$f"
            echo "$sha  $RUNNER_TEMP/shorts/$f" | sha256sum -c -
          done
      - name: QA gate and publish (each Short private until its slot, then public automatically)
        if: env.SKIP != '1'
        env:
          HERO_YT_AUTHORIZED_USER_JSON: ${{ secrets.HERO_YT_AUTHORIZED_USER_JSON }}
        run: |
          d="migration/production/$PILOT"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check -q google-auth==2.40.3 requests==2.32.4
          git fetch -q origin main
          git merge --ff-only FETCH_HEAD
          if [ -f migration/ops/PUBLICATION_HOLD ]; then echo PUBLICATION_HOLD; exit 1; fi
          python3 -I -B migration/publish/shorts_prerequisite.py "$d"
          expected=$(cat "$RUNNER_TEMP/downloaded-shorts-manifest.sha256")
          actual=$(sha256sum "$d/shorts/shorts.json" | cut -d' ' -f1)
          [ "$expected" = "$actual" ] || { echo APPROVED_MANIFEST_CHANGED; exit 1; }
          key="$PILOT:$(python3 -I -c "import json,sys;print(json.load(open(sys.argv[1]))['output_sha256'])" "$d/out/manifest.json")"
          if python3 -I -c "import json,sys;m=json.load(open(sys.argv[1]));sys.exit(0 if 'owner_exception' in m.get('finalization', {}) else 1)" "$d/shorts/shorts.json"; then
            exception_slot=$(python3 -I -c "import json,sys;print(json.load(open(sys.argv[1]))['finalization']['owner_exception']['target_slot'])" "$d/shorts/shorts.json")
            [ "$SLOTS" = "$exception_slot" ] || { echo EXCEPTION_SLOT_MISMATCH_BEFORE_RESERVATION; exit 1; }
            run_key="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
            python3 -I -B migration/publish/publication_exception.py --reserve migration/publish/ledger.json "$d/shorts/shorts.json" "$run_key"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add migration/publish/ledger.json
            if ! git diff --cached --quiet; then git commit -q -m "Reserve publication exception ($run_key)"; fi
            git push -q origin HEAD:main
            git fetch -q origin main
            [ "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)" ] || { echo EXCEPTION_REMOTE_HEAD_CHANGED; exit 1; }
            git show FETCH_HEAD:migration/publish/ledger.json > "$RUNNER_TEMP/reserved-publication-ledger.json"
            cmp migration/publish/ledger.json "$RUNNER_TEMP/reserved-publication-ledger.json" || { echo EXCEPTION_RESERVATION_PERSISTENCE_UNCONFIRMED; exit 1; }
          fi
          mkdir -p migration/publish/receipts
          "$RUNNER_TEMP/venv/bin/python" -I -B migration/publish/publish_shorts.py "$d/shorts/shorts.json" "$RUNNER_TEMP/shorts" "$key" \
            migration/publish/ledger.json "migration/publish/receipts/$PILOT-shorts-$GITHUB_RUN_ID.json" "$SLOTS"
      - name: Record ledger and receipt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration/publish/ledger.json migration/publish/receipts
          if ! git diff --cached --quiet; then git commit -q -m "Publish $PILOT Shorts (run $GITHUB_RUN_ID)"; fi
          git pull --rebase -q origin main
          git push -q origin HEAD:main
          git fetch -q origin main
          for path in migration/publish/ledger.json "migration/publish/receipts/$PILOT-shorts-$GITHUB_RUN_ID.json"; do
            [ -f "$path" ] || continue
            git show "FETCH_HEAD:$path" > "$RUNNER_TEMP/persisted-publication.json"
            cmp "$path" "$RUNNER_TEMP/persisted-publication.json" || { echo PUBLICATION_PERSISTENCE_UNCONFIRMED; exit 1; }
          done
      - name: Delete the published Shorts files from the private release (owner rule)
        if: env.SKIP != '1'
        run: |
          r="migration/publish/receipts/$PILOT-shorts-$GITHUB_RUN_ID.json"
          python3 -I -c "import json,sys;[print(x['file'],x.get('verification_status', 'VERIFICATION_UNKNOWN'),x['output_sha256']) for x in json.load(open(sys.argv[1]))['shorts']]" "$r" |
          while read -r f st sha; do
            case "$st" in SCHEDULED_VERIFIED|PUBLIC_VERIFIED) ;; *) echo "KEEP $f ($st)"; continue;; esac
            asset="$PILOT-${f%.mp4}-sha256-$sha.mp4"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/release-assets.txt"
            if grep -Fxq "$asset" "$RUNNER_TEMP/release-assets.txt"; then
              gh release delete-asset "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" -y
            else
              echo "ALREADY_ABSENT $asset"
            fi
          done
