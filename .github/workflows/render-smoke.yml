name: HeroVerse render smoke (a ~1 minute cut through the whole render path)
# E68: a production change that breaks the render must fail here in minutes, not after a 2.5 h render on a publication slot.
on:
  pull_request:
    branches: [main]
    paths:
      - migration/production/*.py
      - migration/production/qa_criteria_*.json
      - migration/production/imagegen/**
      - migration/production/footage/*.py
      - migration/ci/**
      - .github/workflows/pilot-render-stills.yml
      - .github/workflows/render-smoke.yml
      - .github/workflows/pilot-preview.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: heroverse-render-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      ENGINE_REPO: ${{ github.repository }}
      TAG: v0.0.0-cloud-assets-20261013
      PILOT: pilot-011          # a footage-only (v4) pilot: the current production shape
      SMOKE: '1'
      RUN_LABEL: smoke ${{ github.run_id }}
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Render the cut, QA, package, thumbnail; verdict
        run: bash migration/ci/render_pilot.sh
