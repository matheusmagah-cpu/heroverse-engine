name: HeroVerse Linux validation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/linux-validation.yml'
      - 'migration/verify_cloud_source.py'
      - 'HeroVerse_Linux_Source_Ready_20261013_v2.zip'
permissions:
  contents: read
concurrency:
  group: heroverse-linux-validation
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install required video dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Verify private source and bounded infrastructure
        run: python3 migration/verify_cloud_source.py
      - name: Validate immutable Linux evidence commit
        run: python3 -m unittest discover -s migration -p test_linux_atomic_commit.py -v
      - name: Probe kernel containment capability without production workers
        run: python3 migration/probe_linux_containment.py
