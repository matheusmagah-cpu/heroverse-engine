name: HeroVerse AV semantic layer qualification
on:
  push:
    paths:
      - '.github/workflows/av-semantic-qualification.yml'
      - 'migration/diagnostics/av-semantic/**'
      - 'migration/diagnostics/av-profile/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: heroverse-av-semantic-qualification
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.event.repository.private == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.0.0-cloud-assets-20261013
      YAMNET_SHA256: 10c95ea3eb9a7bb4cb8bddf6feb023250381008177ac162ce169694d05c317de
      YAMNET_ASSET: yamnet-classification-tflite-v1-sha256-10c95ea3eb9a7bb4cb8bddf6feb023250381008177ac162ce169694d05c317de.tflite
      WHISPER_SHA256: 78634f845a29c523d117a29a1a14b293220787f5ede2c6c0f33a9b06c2f805cb
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install ffmpeg, espeak-ng and pinned Python runtimes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check -q ai-edge-litert==2.3.0 faster-whisper==1.2.1
      - name: YAMNet model (release copy, else original source; hash-pinned and preserved)
        run: |
          mkdir -p "$RUNNER_TEMP/models"; cd "$RUNNER_TEMP/models"
          if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$YAMNET_ASSET"; then
            mv "$YAMNET_ASSET" yamnet.tflite
            echo "$YAMNET_SHA256  yamnet.tflite" | sha256sum -c -
          else
            curl -fsSL -o yamnet.tflite "https://tfhub.dev/google/lite-model/yamnet/classification/tflite/1?lite-format=tflite" \
              || curl -fsSL -o yamnet.tflite "https://storage.googleapis.com/tfhub-lite-models/google/lite-model/yamnet/classification/tflite/1.tflite"
            echo "$YAMNET_SHA256  yamnet.tflite" | sha256sum -c -
            cp yamnet.tflite "$YAMNET_ASSET"
            gh release upload "$TAG" "$YAMNET_ASSET" --repo "$GITHUB_REPOSITORY"
          fi
      - name: Preserved Whisper base.en model and the five openings
        run: |
          cd "$RUNNER_TEMP/models"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern HeroVerse_ASR_base_en_preservado.zip
          echo "$WHISPER_SHA256  HeroVerse_ASR_base_en_preservado.zip" | sha256sum -c -
          "$RUNNER_TEMP/venv/bin/python" -I -c "import sys; from pathlib import Path; sys.path.insert(0, '$GITHUB_WORKSPACE/migration'); import second_opening_asr as a; a.extract_model(Path('HeroVerse_ASR_base_en_preservado.zip'), Path('whisper'))"
          mkdir -p "$RUNNER_TEMP/openings"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'native-*-0-40s-sha256-*.mp4' --dir "$RUNNER_TEMP/openings"
          cd "$RUNNER_TEMP/openings"
          for f in *.mp4; do want="${f##*-sha256-}"; echo "${want%.mp4}  $f" | sha256sum -c -; done
      - name: Semantic qualification
        working-directory: migration/diagnostics/av-semantic
        run: |
          "$RUNNER_TEMP/venv/bin/python" -I -B -c "import sys; sys.path.insert(0, '.'); import qualify_semantic as q; sys.exit(q.main(*sys.argv[1:4], sys.argv[4:]))" \
            "$RUNNER_TEMP/semantic.json" "$RUNNER_TEMP/models/yamnet.tflite" "$RUNNER_TEMP/models/whisper" "$RUNNER_TEMP"/openings/*.mp4 || status=$?
          cat "$RUNNER_TEMP/semantic.json"
          exit ${status:-0}
      - name: Profile tests and reference AV profiles of the five openings
        if: always()
        working-directory: migration/diagnostics/av-profile
        run: |
          "$RUNNER_TEMP/venv/bin/python" -I -B -m unittest discover -s . -p test_av_profile.py -v
          "$RUNNER_TEMP/venv/bin/python" -I -B profile_openings.py "$RUNNER_TEMP/profiles.json" \
            "$RUNNER_TEMP/models/yamnet.tflite" "$RUNNER_TEMP/models/whisper" "$RUNNER_TEMP"/openings/*.mp4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: av-semantic-qualification-and-profiles
          path: |
            ${{ runner.temp }}/semantic.json
            ${{ runner.temp }}/profiles.json
          retention-days: 30
          if-no-files-found: warn
