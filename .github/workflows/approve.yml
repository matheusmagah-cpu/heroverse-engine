name: HeroVerse approval (automatic gates before publication)
# Owner rule: automatic publication is authorised once everything passes the gates.
# Starts when a render is recorded (out/qa.json pushed by the runner or the private render).
# Gates, in order: frozen QA PASS; preflight; same-instrument scorecard (our render mined with the reference
# miner through the Gemini Files API); watched review of the long video; final decision PASS/FAIL/UNKNOWN over
# every dimension (publish/prepublish_gate.py, out/gate.json). Only PASS -> inspection/APPROVAL.json
# bound to the file hash, then publish.yml at the schedule.json time. Any failure -> out/review.json, no publication.
on:
  push:
    branches: [main]
    paths: ['migration/production/*/out/qa.json']
  workflow_dispatch:
    inputs:
      pilot:
        description: Pilot directory (e.g. pilot-003)
        required: true
permissions:
  contents: write
  actions: write
concurrency:
  group: heroverse-approve
  cancel-in-progress: false
jobs:
  approve:
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.event.repository.private == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.0.0-cloud-assets-20261013
      INPUT_PILOT: ${{ inputs.pilot }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
      - name: Pilot and frozen QA gate
        run: |
          PILOT="$INPUT_PILOT"
          [ -n "$PILOT" ] || PILOT=$(git diff --name-only HEAD~1 HEAD | sed -n 's#^migration/production/\(pilot-[0-9][0-9][0-9]\)/out/qa.json$#\1#p' | head -1)
          case "$PILOT" in pilot-[0-9][0-9][0-9]) ;; *) echo "NO_PILOT"; exit 1;; esac
          d="migration/production/$PILOT"; echo "PILOT=$PILOT" >> "$GITHUB_ENV"
          python3 -I - "$d" <<'PY'
          import json, sys, os
          d = sys.argv[1]
          qa = json.load(open(f"{d}/out/qa.json")); man = json.load(open(f"{d}/out/manifest.json"))
          assert qa["output_sha256"] == man["output_sha256"], "QA_NOT_FOR_THIS_FILE"
          if qa["status"] != "PASS":
              print("QA_FAIL: not approved"); open(os.environ["GITHUB_ENV"], "a").write("SKIP=1\n"); sys.exit(0)
          try:
              ap = json.load(open(f"{d}/inspection/APPROVAL.json"))
              if ap.get("approved") and ap.get("output_sha256") == qa["output_sha256"]:
                  print("ALREADY_APPROVED"); open(os.environ["GITHUB_ENV"], "a").write("SKIP=1\n")
          except FileNotFoundError:
              pass
          print("QA_PASS", qa["output_sha256"])
          PY
      - name: Preflight (YouTube limits, thumbnail, schedule, captions, units)
        if: env.SKIP != '1'
        run: python3 -I -B migration/publish/preflight.py "migration/production/$PILOT" "migration/production/$PILOT/inspection/thumbnail.jpg"
      - name: Render from the private release (hash-verified)
        if: env.SKIP != '1'
        run: |
          sha=$(python3 -I -c "import json,sys;print(json.load(open(sys.argv[1]))['output_sha256'])" "migration/production/$PILOT/out/qa.json")
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$PILOT-sha256-$sha.mp4" -O "$RUNNER_TEMP/video.mp4"
          echo "$sha  $RUNNER_TEMP/video.mp4" | sha256sum -c -
      - name: Same-instrument scorecard and watched review (free Gemini)
        if: env.SKIP != '1'
        env:
          HERO_GEMINI_API_KEY: ${{ secrets.HERO_GEMINI_API_KEY }}
        run: python3 -I -B migration/production/long_review.py "migration/production/$PILOT" "$RUNNER_TEMP/video.mp4"
      - name: Approve and record, or record the failure
        if: env.SKIP != '1'
        run: |
          d="migration/production/$PILOT"
          status=$(python3 -I -c "import json,sys;print(json.load(open(sys.argv[1]))['status'])" "$d/out/review.json")
          # whole-file scan (every frame and sample) of the hash-verified download; complements the sampled review
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null || true
          python3 -I -B migration/production/signal_scan.py "$RUNNER_TEMP/video.mp4" "$d/out/scan.json" || true
          # final decision over every dimension (prepublish_gate.py): only PASS approves; UNKNOWN is retried like ERROR
          decision=$(python3 -I -B migration/publish/prepublish_gate.py "$d" "$RUNNER_TEMP/video.mp4" | python3 -I -c "import json,sys;print(json.loads(sys.stdin.read())['decision'])" || true)
          echo "GATE=$decision"
          [ "$status" = ERROR ] || [ "$decision" = PASS ] || status="GATE_$decision"
          if [ "$status" = PASS ] && [ "$decision" = PASS ]; then
            python3 -I - "$d" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          d = sys.argv[1]
          r = json.load(open(f"{d}/out/review.json")); qa = json.load(open(f"{d}/out/qa.json"))
          w = r["watched_review"]
          json.dump({"approved": True, "output_sha256": qa["output_sha256"],
                     "reviewer": "HeroVerse automatic gates (owner rule: automatic publication once every gate passes)",
                     "reviewed_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), "qa_status": qa["status"],
                     "gates": {"qa": "PASS", "preflight": "PASS", "scorecard_hard": "PASS",
                               "watched_review": {"overall": w.get("overall"), "model": w.get("model")},
                               "prepublish_gate": "PASS"},
                     "notes": "Scorecard and watched review in out/review.json; final decision in out/gate.json."},
                    open(f"{d}/inspection/APPROVAL.json", "w"), indent=1)
          PY
            msg="Approve $PILOT automatically (QA, preflight, scorecard, watched review; run $GITHUB_RUN_ID)"
          else
            msg="Record $PILOT review: $status, not approved (run $GITHUB_RUN_ID; ERROR is retried by reconcile.yml)"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$d/out/review.json" "$d/out/gate.json" "$d/out/scan.json" "$d/inspection/APPROVAL.json" 2>/dev/null || git add "$d/out/review.json" "$d/out/gate.json" "$d/out/scan.json" 2>/dev/null || git add "$d/out/review.json"
          git commit -q -m "$msg"
          for i in 1 2 3 4; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && break
            git rebase --abort 2>/dev/null || true; sleep $((i * 5))
          done
          echo "STATUS=$status" >> "$GITHUB_ENV"
      - name: Publication at the schedule.json time
        if: env.SKIP != '1' && env.STATUS == 'PASS'
        # a push made with this job's token does not start workflows, so publish.yml is dispatched explicitly
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f pilot="$PILOT" -f publish_at=""
