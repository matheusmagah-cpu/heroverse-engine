name: HeroVerse TikTok mirror (Bible Shorts already on YouTube, through Buffer's free plan)
on:
  schedule:
    # owner, 2026-10-26: "published on YouTube, it must go to TikTok". Every 20 minutes: a Short goes out within ~20 min
    # of its YouTube slot, and a dropped cron run (25/10 23:41 never ran) is covered by the next one. A run with
    # nothing pending ends in seconds; one Short per run keeps TikTok posts apart while a backlog clears.
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "post = mirror the next Short; discover = only find the Buffer TikTok channel and list what is pending"
        required: true
        default: post
        type: choice
        options: [post, discover]
permissions:
  contents: write
concurrency:
  group: heroverse-tiktok
  cancel-in-progress: false
jobs:
  mirror:
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      MODE: ${{ inputs.mode || 'post' }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Publication hold and configuration
        id: cfg
        run: |
          if [ -f migration/ops/PUBLICATION_HOLD ]; then cat migration/ops/PUBLICATION_HOLD; echo "PUBLICATION_HOLD"; exit 1; fi
          case "$MODE" in post|discover) ;; *) echo INVALID_MODE; exit 1;; esac
          if [ -z "$BUFFER_API_KEY" ]; then echo "BUFFER_NOT_CONFIGURED"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - name: The public file Buffer will fetch is the approved one
        if: steps.cfg.outputs.skip != '1' && env.MODE == 'post'
        run: |
          python3 -I -B migration/publish/tiktok_publish.py pending migration/publish/ledger.json \
            migration/publish/tiktok_ledger.json migration/production/bible/episodes > "$RUNNER_TEMP/pending.txt"
          read -r key asset < "$RUNNER_TEMP/pending.txt" || { echo "NOTHING_TO_CHECK"; exit 0; }
          bash "$GITHUB_WORKSPACE/migration/ci/assets.sh" download --repo "$GITHUB_REPOSITORY" --pattern "$asset" -D "$RUNNER_TEMP"
          tag=$(bash "$GITHUB_WORKSPACE/migration/ci/assets.sh" which "$asset")   # E85: the release Buffer fetches from
          echo "ASSET_RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          sha="${asset##*-sha256-}"; sha="${sha%.mp4}"
          echo "$sha  $RUNNER_TEMP/$asset" | sha256sum -c -
      - name: Send to TikTok through Buffer and record
        if: steps.cfg.outputs.skip != '1'
        run: |
          python3 -I -B migration/publish/tiktok_publish.py "$MODE" migration/publish/ledger.json \
            migration/publish/tiktok_ledger.json migration/production/bible/episodes
      - name: Commit the TikTok ledger
        if: always() && steps.cfg.outputs.skip != '1' && env.MODE == 'post'
        run: |
          [ -z "$(git status --porcelain migration/publish/tiktok_ledger.json)" ] && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration/publish/tiktok_ledger.json
          git commit -q -m "TikTok mirror: record (run $GITHUB_RUN_ID)"
          for i in 1 2 3 4 5; do   # the ledger is what stops a second post: it must land
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "TIKTOK_LEDGER_NOT_PUSHED (check Buffer before the next run)"; exit 1
