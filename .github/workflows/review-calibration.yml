name: HeroVerse review calibration (known-answer cases for the automatic review)
# Manual. A QA-PASS render (hash-verified from the private release) -> 180 s control + deliberate-defect copies ->
# whole-file scan and watched review on each -> evidence/review-calibration/<pilot>.json. Free Gemini only.
on:
  workflow_dispatch:
    inputs:
      pilot:
        description: Pilot whose QA-PASS render is still in the private release (e.g. pilot-003)
        required: true
permissions:
  contents: write
concurrency:
  group: heroverse-review-calibration
  cancel-in-progress: false
jobs:
  calibrate:
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.event.repository.private == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.0.0-cloud-assets-20261013
      PILOT: ${{ inputs.pilot }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Render (hash-verified, QA PASS only)
        run: |
          case "$PILOT" in pilot-[0-9][0-9][0-9]) ;; *) exit 1;; esac
          d="migration/production/$PILOT"
          read -r st sha < <(python3 -I -c "import json,sys;q=json.load(open(sys.argv[1]));print(q['status'],q['output_sha256'])" "$d/out/qa.json")
          [ "$st" = PASS ] || { echo "QA_NOT_PASS"; exit 1; }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$PILOT-sha256-$sha.mp4" -O "$RUNNER_TEMP/render.mp4"
          echo "$sha  $RUNNER_TEMP/render.mp4" | sha256sum -c -
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null
      - name: Cases, scan and watched review
        env:
          HERO_GEMINI_API_KEY: ${{ secrets.HERO_GEMINI_API_KEY }}
        run: |
          title=$(python3 -I -c "import json,sys;print(json.load(open(sys.argv[1]))['working_title'])" "migration/production/$PILOT/script.json")
          python3 -I -B migration/production/review_calibration.py "$RUNNER_TEMP/render.mp4" "$RUNNER_TEMP/work" \
            "migration/evidence/review-calibration/$PILOT.json" "$title"
      - name: Record
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration/evidence/review-calibration || true
          git commit -q -m "Record review calibration $PILOT (run $GITHUB_RUN_ID)" || exit 0
          for i in 1 2 3 4; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true; sleep $((i * 5))
          done
          exit 1
