name: HeroVerse reviewer probe (one tiny text call per free model; diagnosis only)
on:
  workflow_dispatch:
    inputs:
      models:
        description: Models to probe, space separated (empty = the free models)
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: heroverse-official-evidence
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Probe
        env:
          HERO_GEMINI_API_KEY: ${{ secrets.HERO_GEMINI_API_KEY }}
          MODELS: ${{ inputs.models }}
        run: |
          mkdir -p migration/evidence/reviewer-probe
          python3 -I -B migration/ops/reviewer_probe.py "migration/evidence/reviewer-probe/probe-$(date -u +%Y%m%dT%H%M).json" $MODELS
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration/evidence/reviewer-probe
          git commit -q -m "Record reviewer probe (run $GITHUB_RUN_ID)"
          git pull --rebase -q origin main && git push -q origin HEAD:main
