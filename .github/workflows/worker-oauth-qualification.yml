name: HeroVerse worker OAuth qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: heroverse-worker-oauth
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate offline authorization boundaries
        run: python3 -m unittest discover -s migration -p test_verify_worker_oauth.py -v
      - name: Check existing authorized token availability
        env:
          HERO_YT_AUTHORIZED_USER_JSON: ${{ secrets.HERO_YT_AUTHORIZED_USER_JSON }}
        run: |
          python3 - <<'PY'
          import os,sys
          sys.path.insert(0,'migration')
          from verify_worker_oauth import check_token,emit
          reason=check_token(os.environ.get('HERO_YT_AUTHORIZED_USER_JSON',''))
          if reason:
              emit({'status':'BLOCKED','failure_code':reason,'secret_values_logged':False,'publication_performed':False})
              sys.exit(2)
          PY
      - name: Install bounded OAuth qualification dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/oauth-venv"
          "$RUNNER_TEMP/oauth-venv/bin/python" -m pip install jsonschema==4.26.0 google-api-python-client==2.170.0 google-auth==2.40.3 google-auth-oauthlib==1.2.2 requests==2.32.4
      - name: Prove original refresh and exact HeroVerse channel
        env:
          HERO_YT_AUTHORIZED_USER_JSON: ${{ secrets.HERO_YT_AUTHORIZED_USER_JSON }}
        run: '"$RUNNER_TEMP/oauth-venv/bin/python" migration/verify_worker_oauth.py'
