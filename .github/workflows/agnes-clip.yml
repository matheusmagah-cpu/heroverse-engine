name: HeroVerse Agnes test clip (free Flash tier; review artifact only, nothing published)
run-name: "agnes-clip: seconds=${{ inputs.seconds }} aspect=${{ inputs.aspect }} characters=${{ inputs.characters }} first_frame=${{ inputs.first_frame }} prompt=${{ inputs.prompt }}"
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: What the clip shows (one action, one camera move; PROMPT_GUIDE.md)
        required: true
      seconds:
        description: 4-12
        required: false
        default: '6'
      aspect:
        description: 9:16 (Short) or 16:9
        required: false
        default: '9:16'
      characters:
        description: Optional reference mode - comma-separated APPROVED character ids (characters/characters.json); the prompt must carry each look word for word
        required: false
        default: ''
      first_frame:
        description: Optional keyframe mode - the release asset name of an approved still (e.g. pilot-015-img-st-serpent-sha256-....png)
        required: false
        default: ''
permissions:
  actions: read   # E116: the dispatch guard reads runs (read-only)
  contents: read
concurrency:
  group: heroverse-agnes
  cancel-in-progress: false
jobs:
  clip:
    if: github.repository == 'matheusmagah-cpu/heroverse-engine'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PROMPT: ${{ inputs.prompt }}
      SECONDS_IN: ${{ inputs.seconds }}
      ASPECT: ${{ inputs.aspect }}
      FIRST_FRAME: ${{ inputs.first_frame }}
      CHARACTERS: ${{ inputs.characters }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Dispatch guard (inputs, capacity, one run per subject, no re-run without a fix, imports; E116)
        id: guard
        env:
          GUARD_INPUTS: ${{ toJSON(inputs) }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B migration/ops/dispatch_guard.py run agnes-clip.yml
      - name: The release holding the first frame (E85)
        if: inputs.first_frame != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$FIRST_FRAME" =~ ^[A-Za-z0-9._-]+\.(png|jpg|jpeg)$ ]] || { echo "FIRST_FRAME_REFUSED"; exit 1; }
          tag=$(bash migration/ci/assets.sh which "$FIRST_FRAME")
          echo "FRAME_TAG=$tag" >> "$GITHUB_ENV"
      - name: Generate, download and check the clip
        env:   # E116: the secret at step level, after the guard
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          set -o pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null
          [[ "$SECONDS_IN" =~ ^([4-9]|1[0-2])$ ]] || { echo "SECONDS_REFUSED"; exit 1; }
          [[ "$ASPECT" == "9:16" || "$ASPECT" == "16:9" ]] || { echo "ASPECT_REFUSED"; exit 1; }
          [ "${#PROMPT}" -le 1500 ] || { echo "PROMPT_TOO_LONG"; exit 1; }
          [[ -z "$CHARACTERS" || "$CHARACTERS" =~ ^[a-z0-9-]+(,[a-z0-9-]+)*$ ]] || { echo "CHARACTERS_REFUSED"; exit 1; }
          frame_url=""
          if [ -n "$FIRST_FRAME" ]; then
            [[ "$FIRST_FRAME" =~ ^[A-Za-z0-9._-]+\.(png|jpg|jpeg)$ ]] || { echo "FIRST_FRAME_REFUSED"; exit 1; }
            [[ "$FRAME_TAG" =~ ^v0\.0\.0-cloud-assets-[0-9]{8}$ ]] || { echo "FRAME_TAG_MISSING"; exit 1; }
            frame_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$FRAME_TAG/$FIRST_FRAME"
          fi
          mkdir -p "$RUNNER_TEMP/out"
          printf '%s' "$PROMPT" > "$RUNNER_TEMP/out/prompt.txt"
          python3 -I -B migration/production/agnes_clip.py "$RUNNER_TEMP/out/prompt.txt" "$RUNNER_TEMP/out/clip.mp4" "$SECONDS_IN" "$ASPECT" "$frame_url" "$CHARACTERS"
          ffprobe -v error -show_entries stream=codec_type,width,height,r_frame_rate:format=duration -of json "$RUNNER_TEMP/out/clip.mp4" | tee "$RUNNER_TEMP/out/probe.json"
          python3 -I -B migration/production/bible/clip_check.py "$RUNNER_TEMP/out/clip.mp4" | tee "$RUNNER_TEMP/out/clip_check.json" || true
          d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$RUNNER_TEMP/out/clip.mp4")
          for k in 1 2 3 4 5 6; do   # frames for Claude's review (watermark, artefacts, modern objects)
            ffmpeg -v error -y -ss "$(python3 -c "print($d*($k*2-1)/12)")" -i "$RUNNER_TEMP/out/clip.mp4" -frames:v 1 "$RUNNER_TEMP/out/frame-$k.jpg"
          done
          ffmpeg -v error -y -pattern_type glob -i "$RUNNER_TEMP/out/frame-*.jpg" -vf "scale=360:-1,tile=6x1" -frames:v 1 "$RUNNER_TEMP/out/sheet.jpg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agnes-clip-${{ github.run_id }}
          path: ${{ runner.temp }}/out
          retention-days: 14
