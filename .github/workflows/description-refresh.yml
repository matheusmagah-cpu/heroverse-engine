name: HeroVerse pilot012 opening chapter correction
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only inspection or guarded description correction
        type: choice
        default: inspect
        options: [inspect, apply]
        required: true
permissions:
  contents: write
concurrency:
  group: heroverse-publish
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Regression tests before metadata mutation
        run: |
          python3 -I -B migration/publish/test_package_chapters.py
          python3 -I -B migration/publish/test_refresh_description.py
      - name: Dependencies already used by publication
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check -q google-auth==2.40.3 requests==2.32.4
      - name: Correct only the opening chapter, verify preserved metadata
        env:
          HERO_YT_AUTHORIZED_USER_JSON: ${{ secrets.HERO_YT_AUTHORIZED_USER_JSON }}
          REFRESH_MODE: ${{ inputs.mode }}
        run: |
          "$RUNNER_TEMP/venv/bin/python" -I -B migration/publish/refresh_description.py \
            migration/production/pilot-012 \
            migration/publish/receipts/pilot-012-39312563293.json \
            "migration/evidence/chapter-description/20261020/live-${GITHUB_RUN_ID}.json" "$REFRESH_MODE"
      - name: Record sanitized metadata-only result
        if: always()
        run: |
          path="migration/evidence/chapter-description/20261020/live-${GITHUB_RUN_ID}.json" "$REFRESH_MODE"
          test -f "$path" || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git commit -m "Record pilot012 opening chapter description correction (run $GITHUB_RUN_ID)"
          for i in 1 2 3 4; do
            git pull --no-rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
