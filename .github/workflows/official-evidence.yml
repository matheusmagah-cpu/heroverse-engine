name: HeroVerse bounded official evidence
on:
  push:
    paths:
      - 'migration/evidence/focused-refinement-request.json'
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      checkpoint_only:
        description: Skip new owned and market collection; readiness may refresh identity
        type: boolean
        default: true
      native_readiness:
        description: Rebuild native cloud readiness documents without publishing
        type: boolean
        default: false
      auth_health_only:
        description: Verify existing refresh and exact channel without market collection
        type: boolean
        default: false
      av_windowed_reference:
        description: Analyze complete public reference in bounded audiovisual windows now
        type: boolean
        default: false
      av_refine_reference:
        description: Refine unresolved audiovisual scenes sequentially
        type: boolean
        default: false
      av_verify_checkpoint:
        description: Verify saved audiovisual windows without provider calls
        type: boolean
        default: false
      av_input_diagnostic:
        description: Diagnose text generation and ten-second AV input now
        type: boolean
        default: false
      av_diagnostic:
        description: Diagnose Gemini credential and model metadata without processing video
        type: boolean
        default: false
      av_reference:
        description: Analyze the exact public teaching reference using securely provisioned free Gemini
        type: boolean
        default: false
      restore_assets:
        description: Qualify exact private media restoration without production
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: heroverse-official-evidence
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Enforce one selected pending stage before effects
        if: github.event_name == 'workflow_dispatch'
        env:
          HERO_STAGE_SELECTION: ${{ toJSON(inputs) }}
        run: |
          python3 - <<'PY'
          import json,os
          stages=json.loads(os.environ['HERO_STAGE_SELECTION'])
          chosen=[name for name,value in stages.items() if name!='checkpoint_only' and value is True]
          if len(chosen)>1:
              print(json.dumps({'status':'ONE_STAGE_AT_A_TIME_REQUIRED','selected_stages':chosen,'remote_effects':0}))
              raise SystemExit(2)
          print(json.dumps({'status':'SINGLE_STAGE_SELECTED','stage':chosen[0] if chosen else 'checkpoint','remote_effects':0}))
          PY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - name: Validate exact owner-requested push stage
        if: github.event_name == 'push'
        id: push_stage
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('migration/evidence/focused-refinement-request.json').read_text())
          assert r['publication_authorized'] is False
          if r['mode']=='REFINE_ONLY_REUSE_COMPLETED':
              assert r['request_id']=='20261014-fine-scene-recovery-v1'
              assert r['source_video_id']=='7GvhWbXDWHQ'
              stage='refine'
          elif r['mode'] in ('CANDIDATE_METADATA_ONLY','CANDIDATE_CATALOG_ONLY'):
              assert r['request_id'] in ('20261014-three-hour-reference-discovery-v1','20261014-three-hour-reference-catalog-v1')
              assert r['source_video_ids']==['TYCZe65GxdQ','ZGiGg9O09yU','beIMxaH7YuI']
              stage='catalog' if r['mode']=='CANDIDATE_CATALOG_ONLY' else 'candidate'
          elif r['mode']=='MARKET_AV_SAMPLE_ONLY':
              assert r['request_id']=='20261014-market-music-sample-v1'
              assert r['plan_sha256']=='6da4eb09834dacdf7bb6941fabca9a9c2c75b2f6687c7304b12c6f745183a6b6'
              stage='market_av'
          elif r['mode']=='MARKET_TRANSIENT_RECOVERY_ONLY':
              assert r['request_id']=='20261014-owner-market-503-recovery-1'
              assert r['prior_receipt_sha256']=='66f24a44393635d974adaea9d43ce3ad10be26fbb2ef3c1bb05b1def5d00c6ff'
              stage='market_recovery'
          else:
              raise PermissionError('UNKNOWN_OWNER_REQUEST_STAGE')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('stage='+stage+'\n')
          print('Exact bounded '+stage+' request verified; no publication authority')
          PY
      - name: Claim durable observer and restore current quota source
        id: durable_claim
        run: python3 migration/durable_evidence_checkpoint.py claim
      - name: Test observation boundaries
        run: python3 -m unittest discover -s migration -p 'test_*evidence*.py' -v
      - name: Restore checkpoint without API collection
        if: inputs.checkpoint_only || (github.event_name == 'push' && steps.push_stage.outputs.stage != 'candidate' && steps.push_stage.outputs.stage != 'catalog')
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,"migration")
          from durable_evidence_checkpoint import restore_ledger,SQL
          out=Path("cloud-evidence");out.mkdir()
          restore_ledger(SQL,out/"quota-ledger.sqlite3")
          print("Original ledger restored; no Google calls or publications")
          PY
      - name: Prepare bounded fresh-runner media restoration
        if: inputs.restore_assets && inputs.checkpoint_only
        run: |
          if [ -d /usr/local/lib/android ]; then sudo rm -rf /usr/local/lib/android; fi
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Restore exact own assets from private repository
        if: inputs.restore_assets && inputs.checkpoint_only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 migration/restore_private_media.py
      - name: Install pinned read-only API dependencies
        if: ${{ (github.event_name != 'push' && (!inputs.checkpoint_only || inputs.native_readiness)) || (steps.push_stage.outputs.stage == 'candidate' || steps.push_stage.outputs.stage == 'catalog') }}
        run: |
          python3 -m venv "$RUNNER_TEMP/evidence-venv"
          "$RUNNER_TEMP/evidence-venv/bin/python" -m pip install jsonschema==4.26.0 google-api-python-client==2.170.0 google-auth==2.40.3 google-auth-oauthlib==1.2.2 requests==2.32.4
      - name: Rebuild native cloud runtime documents
        if: inputs.native_readiness && inputs.checkpoint_only
        env:
          HERO_YT_AUTHORIZED_USER_JSON: ${{ secrets.HERO_YT_AUTHORIZED_USER_JSON }}
        run: '"$RUNNER_TEMP/evidence-venv/bin/python" migration/runtime_bridge/rebuild_cloud_readiness.py'
      - name: Collect observed owned and market data through original quota ledger
        if: ${{ (github.event_name != 'push' && !inputs.checkpoint_only) || (steps.push_stage.outputs.stage == 'candidate' || steps.push_stage.outputs.stage == 'catalog') }}
        env:
          HERO_CANDIDATE_PROBE_ONLY: ${{ (steps.push_stage.outputs.stage == 'candidate' || steps.push_stage.outputs.stage == 'catalog') }}
          HERO_CANDIDATE_CATALOG_ONLY: ${{ steps.push_stage.outputs.stage == 'catalog' }}
          HERO_AUTH_HEALTH_ONLY: ${{ inputs.auth_health_only }}
          HERO_YT_AUTHORIZED_USER_JSON: ${{ secrets.HERO_YT_AUTHORIZED_USER_JSON }}
        run: '"$RUNNER_TEMP/evidence-venv/bin/python" migration/collect_official_evidence.py'
      - name: Test and refine unresolved audiovisual scenes
        if: steps.push_stage.outputs.stage == 'refine' || (inputs.av_refine_reference && inputs.checkpoint_only)
        env:
          HERO_GEMINI_API_KEY: ${{ secrets.HERO_GEMINI_API_KEY }}
        run: |
          python3 -m unittest discover -s migration/runtime_bridge -p 'test_*public_av.py' -v
          python3 migration/runtime_bridge/observe_public_av.py refine
      - name: Analyze only owner-requested market audiovisual samples sequentially
        if: steps.push_stage.outputs.stage == 'market_av'
        env:
          HERO_GEMINI_API_KEY: ${{ secrets.HERO_GEMINI_API_KEY }}
        run: |
          python3 -m unittest discover -s migration/runtime_bridge -p 'test_*public_av.py' -v
          python3 migration/runtime_bridge/observe_market_av.py
      - name: Recover one exact owner-authorized transient failure then the unstarted source
        if: steps.push_stage.outputs.stage == 'market_recovery'
        env:
          HERO_GEMINI_API_KEY: ${{ secrets.HERO_GEMINI_API_KEY }}
        run: |
          python3 -m unittest discover -s migration/runtime_bridge -p 'test_*public_av.py' -v
          python3 migration/runtime_bridge/recover_market_av.py
      - name: Verify saved audiovisual checkpoint without provider calls
        if: inputs.av_verify_checkpoint && inputs.checkpoint_only
        run: python3 migration/runtime_bridge/observe_public_av.py verify_checkpoint
      - name: Test and analyze bounded audiovisual windows
        if: inputs.av_windowed_reference && inputs.checkpoint_only
        env:
          HERO_GEMINI_API_KEY: ${{ secrets.HERO_GEMINI_API_KEY }}
        run: |
          python3 -m unittest discover -s migration/runtime_bridge -p 'test_*public_av.py' -v
          python3 migration/runtime_bridge/observe_public_av.py windows
      - name: Diagnose text and ten-second audiovisual input
        if: inputs.av_input_diagnostic && inputs.checkpoint_only
        env:
          HERO_GEMINI_API_KEY: ${{ secrets.HERO_GEMINI_API_KEY }}
        run: python3 migration/runtime_bridge/observe_public_av.py diagnose_inputs
      - name: Diagnose Gemini model metadata without video processing
        if: inputs.av_diagnostic && inputs.checkpoint_only
        env:
          HERO_GEMINI_API_KEY: ${{ secrets.HERO_GEMINI_API_KEY }}
        run: python3 migration/runtime_bridge/observe_public_av.py diagnose
      - name: Test bounded audiovisual adapter
        if: inputs.av_reference && inputs.checkpoint_only
        run: python3 -m unittest discover -s migration/runtime_bridge -p 'test_*public_av.py' -v
      - name: Analyze public reference through existing observer ledger
        if: github.event_name == 'schedule' || (inputs.av_reference && inputs.checkpoint_only)
        env:
          HERO_GEMINI_API_KEY: ${{ secrets.HERO_GEMINI_API_KEY }}
        run: python3 migration/runtime_bridge/observe_public_av.py
      - name: Commit durable quota continuation
        if: always() && steps.durable_claim.outcome == 'success'
        run: python3 migration/durable_evidence_checkpoint.py checkpoint
      - name: Preserve evidence and quota continuation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heroverse-official-evidence-${{ github.run_id }}
          path: cloud-evidence/
          retention-days: 30
          if-no-files-found: ignore
