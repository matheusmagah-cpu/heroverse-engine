name: HeroVerse isolated cloud voice diagnostic
on:
  push:
    paths:
      - 'migration/qualify_cloud_voice.py'
      - '.github/workflows/cloud-voice-diagnostic.yml'
permissions:
  contents: read
concurrency:
  group: heroverse-cloud-voice-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Recover disposable runner toolchain space before model work
        run: |
          sudo --preserve-env=GITHUB_WORKSPACE,GITHUB_ACTIONS,RUNNER_ENVIRONMENT python3 - <<'PY'
          import json, os, shutil, subprocess
          from pathlib import Path
          workspace=Path(os.environ['GITHUB_WORKSPACE']).resolve()
          before=shutil.disk_usage(workspace).free
          target=Path('/usr/local/lib/android/sdk')
          if before<15*1024**3:
              if os.environ.get('GITHUB_ACTIONS')!='true' or os.environ.get('RUNNER_ENVIRONMENT')!='github-hosted':
                  raise RuntimeError('cleanup restricted to disposable GitHub-hosted runner')
              if not str(workspace).startswith('/home/runner/work/') or workspace==Path('/'):
                  raise RuntimeError('unexpected workspace')
              if not target.is_dir() or target.is_symlink() or target.resolve()!=target or target in workspace.parents:
                  raise RuntimeError('unverified optional image toolchain')
              print(json.dumps({'scope':'unused preinstalled Android SDK on disposable runner',
                  'path':str(target),'disk_before':before}),flush=True)
              shutil.rmtree(target)
          after=shutil.disk_usage(workspace).free
          print(json.dumps({'disk_before':before,'disk_after':after,'preserved_floor':15*1024**3}),flush=True)
          if after<15*1024**3:raise RuntimeError('resource floor still unavailable')
          PY
      - name: Install isolated diagnostic runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
          python3 -m venv /tmp/heroverse-voice-diagnostic
          /tmp/heroverse-voice-diagnostic/bin/pip install --disable-pip-version-check 'kokoro-onnx==0.4.9' 'onnxruntime==1.20.1' 'numpy==2.2.6' 'espeakng-loader==0.2.4'
      - name: Qualify real voice and diagnostic render under kernel limits
        run: /tmp/heroverse-voice-diagnostic/bin/python migration/qualify_cloud_voice.py
