name: HeroVerse isolated cloud voice diagnostic
on:
  push:
    paths:
      - 'migration/qualify_cloud_voice.py'
      - '.github/workflows/cloud-voice-diagnostic.yml'
permissions:
  contents: read
concurrency:
  group: heroverse-cloud-voice-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install isolated diagnostic runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
          python3 -m venv /tmp/heroverse-voice-diagnostic
          /tmp/heroverse-voice-diagnostic/bin/pip install --disable-pip-version-check 'kokoro-onnx==0.4.9' 'onnxruntime==1.20.1' 'numpy==2.2.6' 'espeakng-loader==0.2.4'
      - name: Qualify real voice and diagnostic render under kernel limits
        run: /tmp/heroverse-voice-diagnostic/bin/python migration/qualify_cloud_voice.py
