name: HeroVerse preserve verified AV without reacquisition
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: heroverse-preserve-native-av-11975773787
  cancel-in-progress: false
jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Permit only the first preservation execution
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          test "$RUN_NUMBER" = 1
          test "$RUN_ATTEMPT" = 1
      - name: Restore the existing successful artifact within GitHub
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '11975773787'
          run-id: '38741653547'
          github-token: ${{ github.token }}
          path: native-evidence
          merge-multiple: true
      - name: Verify restored native identity and record bounded recovery
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path("native-evidence")
          media = root / "native.mp4"
          assert media.stat().st_size == 26121679, "Native size mismatch"
          digest = hashlib.file_digest(media.open("rb"), "sha256").hexdigest()
          assert digest == "5dca962757c952c8048c746f23f96a325cf15258f429e1e79e7b5ddf72fb0fb5", "Native hash mismatch"
          previous = json.loads((root / "receipt.json").read_text())
          assert previous["download_tools_call_requests"] == 1
          assert previous["complete_clip_decode_passed"] is True
          files = [p for p in root.rglob("*") if p.is_file()]
          assert len(files) <= 32
          assert not any(p.is_symlink() for p in root.rglob("*"))
          total = sum(p.stat().st_size for p in files)
          assert total < 64 * 1024 * 1024
          receipt = {
              "version": "native-av-server-side-preservation-v1",
              "source_run_id": 38741653547,
              "source_artifact_id": 11975773787,
              "preservation_run_id": os.environ["GITHUB_RUN_ID"],
              "native_sha256": digest,
              "restored_bytes": total,
              "restored_files": len(files),
              "provider_calls": 0,
              "binary_sent_through_chat": False,
              "retention_days": 7,
              "production": False,
              "publication": False,
              "supervisor": False,
              "permanent_storage_qualified": False
          }
          (root / "preservation-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print("HEROVERSE_PRESERVATION_RECEIPT=" + json.dumps(receipt))
          PY
      - name: Preserve the same bytes for the current qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-j2rk8ycXe3c-preserved-11975773787
          path: native-evidence/
          if-no-files-found: error
          retention-days: 7
