name: HeroVerse publish (validated video to the exact channel)
on:
  # recording a perceptual approval on main publishes that pilot at its scheduled time (no Claude tools needed)
  push:
    branches: [main]
    paths: ['migration/production/*/inspection/APPROVAL.json']
  workflow_dispatch:
    inputs:
      pilot:
        description: Pilot directory (e.g. pilot-002)
        required: true
      publish_at:
        description: Optional RFC3339 UTC time to go public (scheduled); empty = public now
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: heroverse-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_PILOT: ${{ inputs.pilot }}
      INPUT_PUBLISH_AT: ${{ inputs.publish_at }}
      EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
      - name: Publication hold (owner pause, migration/ops/PUBLICATION_HOLD)
        run: |
          if [ -f migration/ops/PUBLICATION_HOLD ]; then cat migration/ops/PUBLICATION_HOLD; echo "PUBLICATION_HOLD"; exit 1; fi
      - name: Which pilot and when (push = the approval just recorded; schedule from schedule.json)
        run: |
          PILOT="$INPUT_PILOT"; PUBLISH_AT="$INPUT_PUBLISH_AT"
          if [ "$EVENT" = push ]; then
            PILOT=$(git diff --diff-filter=AM --name-only HEAD~1 HEAD | sed -n 's#^migration/production/\(pilot-[0-9][0-9][0-9]\)/inspection/APPROVAL.json$#\1#p' | head -1)
            test -n "$PILOT" || { echo "NO_APPROVAL_IN_PUSH"; exit 1; }
          fi
          echo "PILOT=$PILOT" >> "$GITHUB_ENV"
          sched="migration/production/${PILOT}/schedule.json"
          if [ -z "$PUBLISH_AT" ] && [ -f "$sched" ]; then
            at=$(python3 -I -c "import json,sys,datetime as d;s=json.load(open(sys.argv[1]));t=s.get('publish_at');print(t if t and d.datetime.fromisoformat(t.replace('Z','+00:00'))>d.datetime.now(d.timezone.utc)+d.timedelta(minutes=20) else '')" "$sched")
            PUBLISH_AT="$at"
          fi
          echo "PUBLISH_AT=$PUBLISH_AT" >> "$GITHUB_ENV"
      - name: Gates (QA PASS and recorded perceptual approval of this exact file)
        run: |
          case "$PILOT" in pilot-[0-9][0-9][0-9]) ;; *) exit 1;; esac
          d="migration/production/$PILOT"
          python3 -I -B migration/publish/publication_binding.py "$d"
      - name: Preflight (everything YouTube would reject; skipped when resuming an upload already made)
        run: |
          d="migration/production/$PILOT"
          key="$PILOT:$(python3 -I -c "import json,sys;print(json.load(open(sys.argv[1]))['output_sha256'])" "$d/out/qa.json")"
          if python3 -I -c "import json,sys;sys.exit(0 if sys.argv[2] in json.load(open(sys.argv[1]))['entries'] else 1)" migration/publish/ledger.json "$key" 2>/dev/null; then
            echo "RESUME: already uploaded, preflight not repeated"
          else
            python3 -I -B migration/publish/preflight.py "$d" "$d/inspection/thumbnail.jpg" "$PUBLISH_AT"
          fi
      - name: Video and thumbnail from the private release (hash-verified)
        run: |
          d="migration/production/$PILOT"
          sha=$(python3 -I -c "import json,sys;print(json.load(open(sys.argv[1]))['output_sha256'])" "$d/out/qa.json")
          bash migration/ci/release_video.sh get "$PILOT-sha256-$sha.mp4" "$sha" "$RUNNER_TEMP/video.mp4"  # E60: parts rejoined
          cp "$d/inspection/thumbnail.jpg" "$RUNNER_TEMP/thumbnail.jpg"
      - name: Publish (resumable upload, thumbnail, captions, playlist, first comment, verify)
        id: upload
        env:
          HERO_YT_AUTHORIZED_USER_JSON: ${{ secrets.HERO_YT_AUTHORIZED_USER_JSON }}
        run: |
          d="migration/production/$PILOT"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check -q google-auth==2.40.3 requests==2.32.4
          mkdir -p migration/publish/receipts
          "$RUNNER_TEMP/venv/bin/python" -I -B migration/publish/publish_video.py "$d/out/package.json" "$d/out/manifest.json" \
            "$RUNNER_TEMP/video.mp4" "$RUNNER_TEMP/thumbnail.jpg" migration/publish/ledger.json \
            "migration/publish/receipts/$PILOT-$GITHUB_RUN_ID.json" $PUBLISH_AT
      - name: Shorts of this pilot (approved by the watched review), each at its slot
        # a Short that cannot go out here is not lost: publish-shorts.yml (daily) retries every approved Short not
        # in the ledger. The failure stays visible (no continue-on-error); the steps after it still run.
        if: hashFiles(format('migration/production/{0}/shorts/shorts.json', env.PILOT)) != ''
        id: shorts
        env:
          HERO_YT_AUTHORIZED_USER_JSON: ${{ secrets.HERO_YT_AUTHORIZED_USER_JSON }}
        run: |
          d="migration/production/$PILOT"
          slots=$(python3 -I -c "import json,sys;print(','.join(json.load(open(sys.argv[1])).get('shorts_slots',[])))" "$d/schedule.json" 2>/dev/null || true)
          test -n "$slots" || { echo "NO_SHORTS_SLOTS"; exit 0; }
          sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null
          mkdir -p "$RUNNER_TEMP/shorts"
          python3 -I -B migration/publish/pending_shorts.py --todo "$d" migration/publish/ledger.json |
          while read -r f sha; do
            bash "$GITHUB_WORKSPACE/migration/ci/assets.sh" download --repo "$GITHUB_REPOSITORY" --pattern "$PILOT-${f%.mp4}-sha256-$sha.mp4" -O "$RUNNER_TEMP/shorts/$f"
            echo "$sha  $RUNNER_TEMP/shorts/$f" | sha256sum -c -
          done
          key="$PILOT:$(python3 -I -c "import json,sys;print(json.load(open(sys.argv[1]))['output_sha256'])" "$d/out/manifest.json")"
          "$RUNNER_TEMP/venv/bin/python" -I -B migration/publish/publish_shorts.py "$d/shorts/shorts.json" "$RUNNER_TEMP/shorts" "$key" \
            migration/publish/ledger.json "migration/publish/receipts/$PILOT-shorts-$GITHUB_RUN_ID.json" "$slots"
          python3 -I -c "import json,sys;[print(x['file'],x['upload_status']) for x in json.load(open(sys.argv[1]))['shorts']]" "migration/publish/receipts/$PILOT-shorts-$GITHUB_RUN_ID.json" |
          while read -r f st; do
            case "$st" in uploaded|processed) ;; *) continue;; esac
            sha=$(python3 -I -c "import json,sys;print(next(s['sha256'] for s in json.load(open(sys.argv[1]))['shorts'] if s['file']==sys.argv[2]))" "$d/shorts/shorts.json" "$f")
            bash "$GITHUB_WORKSPACE/migration/ci/assets.sh" delete "$PILOT-${f%.mp4}-sha256-$sha.mp4" || true
          done
      - name: Delete the finished video from the private release (owner rule; YouTube now holds it)
        if: always() && steps.upload.outcome == 'success'
        run: |
          r="migration/publish/receipts/$PILOT-$GITHUB_RUN_ID.json"
          st=$(python3 -I -c "import json,sys;print(json.load(open(sys.argv[1])).get('upload_status'))" "$r")
          case "$st" in uploaded|processed) ;; *) echo "UPLOAD_NOT_CONFIRMED ($st): file kept"; exit 0;; esac
          sha=$(python3 -I -c "import json,sys;print(json.load(open(sys.argv[1]))['output_sha256'])" "migration/production/$PILOT/out/qa.json")
          bash migration/ci/release_video.sh del "$PILOT-sha256-$sha.mp4"  # the file and any parts (E60)
      - name: Record ledger and receipt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration/publish/ledger.json migration/publish/receipts 2>/dev/null || true
          git commit -q -m "Publish $PILOT (run $GITHUB_RUN_ID)" || exit 0
          git pull --rebase -q origin main && git push -q origin HEAD:main
