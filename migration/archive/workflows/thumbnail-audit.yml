name: HeroVerse thumbnail audit (winners' thumbnail facts, STANDARD R9)
# Downloads the public thumbnails of the validated winners on the runner, measures them and records facts only.
# No image is committed. Free support models only (never the designated reviewer's allowance).
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: heroverse-thumbnail-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Pillow (Ubuntu package)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil >/dev/null
      - name: Audit
        env:
          HERO_GEMINI_API_KEY: ${{ secrets.HERO_GEMINI_API_KEY }}
        run: python3 -B migration/mining/thumbnail_audit.py migration/evidence/vidiq/20261019/outliers.json migration/evidence/vidiq/20261019/thumbnails.json
      - name: Record the evidence
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration/evidence/vidiq/20261019/thumbnails.json
          git commit -m "Thumbnail facts of the 20 spoken-prayer winners (run ${{ github.run_id }})" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
