name: HeroVerse RapidAPI MCP connection probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: heroverse-rapidapi-mcp-connection-probe
  cancel-in-progress: false
jobs:
  connect:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify transport and disclosure controls offline
        run: python3 -m unittest discover -s migration/diagnostics/rapidapi-mcp -p test_connection_probe.py -v
      - name: Probe official MCP transport once without media calls
        env:
          HERO_RAPIDAPI_KEY: ${{ secrets.HERO_RAPIDAPI_KEY }}
        run: python3 migration/diagnostics/rapidapi-mcp/connection_probe.py --out output/qualification/rapidapi-mcp/connection.json
