name: HeroVerse Creative Commons visual catalog
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: heroverse-official-evidence
  cancel-in-progress: false
jobs:
  catalog:
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.event.repository.private == true && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Read-only Data API catalog (about 810 quota units, no media)
        env:
          HERO_YT_AUTHORIZED_USER_JSON: ${{ secrets.HERO_YT_AUTHORIZED_USER_JSON }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check -q google-auth==2.40.3 requests==2.32.4
          mkdir -p migration/production/catalog
          "$RUNNER_TEMP/venv/bin/python" -I -B migration/production/cc_catalog.py migration/production/catalog/cc-visual-catalog.json
      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration/production/catalog
          git commit -q -m "Record Creative Commons visual catalog (run $GITHUB_RUN_ID)"
          git pull --rebase -q origin main && git push -q origin HEAD:main
