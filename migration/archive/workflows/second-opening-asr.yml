name: HeroVerse second opening offline ASR once
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: heroverse-second-opening-asr-v1
  cancel-in-progress: false
jobs:
  measure:
    if: github.repository == 'matheusmagah-cpu/heroverse-engine'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - name: Permit only first manual run and attempt
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          NUMBER: ${{ github.run_number }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          test "$EVENT" = workflow_dispatch
          test "$REF" = refs/heads/main
          test "$NUMBER" = 1
          test "$ATTEMPT" = 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/second-opening-asr.yml
            migration/second_opening_asr.py
            migration/test_second_opening_asr.py
            migration/diagnostics/rapidapi-native-av/run_audio_reviewer.py
          sparse-checkout-cone-mode: false
      - name: Focused offline safety tests
        run: python3 -m unittest discover -s migration -p test_second_opening_asr.py -v
      - name: Prepare existing ASR runtime
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          command -v gh
          python3 -m venv "$RUNNER_TEMP/asr-venv"
          "$RUNNER_TEMP/asr-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir faster-whisper==1.2.1
      - name: Measure only preserved second-reference audio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timeout --signal=TERM --kill-after=10s 420s "$RUNNER_TEMP/asr-venv/bin/python" migration/second_opening_asr.py --output second-opening-asr-receipt.json
      - name: Preserve small text-only receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: second-opening-asr-receipt-${{ github.run_id }}
          path: second-opening-asr-receipt.json
          if-no-files-found: ignore
          retention-days: 30
