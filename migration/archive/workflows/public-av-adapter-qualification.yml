name: HeroVerse public AV adapter qualification
on:
  push:
    paths:
      - '.github/workflows/public-av-adapter-qualification.yml'
      - 'migration/runtime_bridge/gemini_public_av.py'
      - 'migration/runtime_bridge/observe_public_av.py'
      - 'migration/runtime_bridge/test_*public_av.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Qualify bounded calls, replay and existing ledger preservation
        run: python3 -m unittest discover -s migration/runtime_bridge -p 'test_*public_av.py' -v
