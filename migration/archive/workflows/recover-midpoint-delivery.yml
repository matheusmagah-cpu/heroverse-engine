name: HeroVerse recover existing midpoint delivery
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: heroverse-midpoint-delivery-recovery-v1
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Permit one recovery only
        run: |
          test "${{ github.run_number }}" = 1
          test "${{ github.run_attempt }}" = 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '11986986812'
          run-id: '38763038099'
          github-token: ${{ github.token }}
          path: midpoint-attempt/
          merge-multiple: true
      - name: Install decoder for the existing artifact only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Recover this existing delivery without any provider API call
        run: python3 migration/diagnostics/rapidapi-native-av/recover_midpoint_delivery.py --attempt-dir midpoint-attempt --output-dir midpoint-recovered
      - name: Preserve recovery result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-midpoint-delivery-recovery-v1
          path: midpoint-recovered/
          retention-days: 1
          if-no-files-found: error
