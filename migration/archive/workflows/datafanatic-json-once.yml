name: DataFanatic private JSON once
on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Only after subscription approval and activation verified: type APPROVED_ACTIVATED_ONE_JSON'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: datafanatic-json-once
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.run_number == 1 && github.run_attempt == 1 && inputs.approval == 'APPROVED_ACTIVATED_ONE_JSON'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Require private repository and approved request
        env:
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
        run: test "$PRIVATE_REPOSITORY" = "true"
      - name: Offline tests
        run: python3 -m unittest discover -s migration/diagnostics/datafanatic-native-av -p 'test_probe.py'
      - name: One metadata request only
        env:
          HERO_RAPIDAPI_KEY: ${{ secrets.HERO_RAPIDAPI_KEY }}
        run: python3 migration/diagnostics/datafanatic-native-av/probe.py migration/diagnostics/datafanatic-native-av/request.json "$RUNNER_TEMP/datafanatic-private"
      - name: Enforce aggregate private artifact limit
        id: artifact_limit
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'datafanatic-private'
          assert sum(f.stat().st_size for f in p.glob('*') if f.is_file()) <= 2 * 1024 * 1024
          PY
      - name: Private JSON inspection only, one-day retention
        if: always() && steps.artifact_limit.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: datafanatic-private-json-once
          path: ${{ runner.temp }}/datafanatic-private/
          retention-days: 1
          if-no-files-found: ignore
          compression-level: 0
