name: HeroVerse acquire reference windows
on:
  workflow_dispatch:
    inputs:
      windows:
        description: 'Up to 12 windows "VIDEO:START:END" separated by ";" (10-60 s each)'
        required: true
permissions:
  contents: write
  actions: write
concurrency:
  group: heroverse-official-evidence
  cancel-in-progress: false
jobs:
  acquire:
    if: github.repository == 'matheusmagah-cpu/heroverse-engine' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      WINDOWS: ${{ inputs.windows }}
      GH_TOKEN: ${{ github.token }}
      TAG: v0.0.0-cloud-assets-20261013
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Offline guards
        run: python3 -I -B -m unittest discover -s migration/acquisition -p test_acquire_window.py -v
      - name: Decoder, pinned runtimes and hash-pinned models
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check -q ai-edge-litert==2.3.0 faster-whisper==1.2.1
          mkdir -p "$RUNNER_TEMP/models" && cd "$RUNNER_TEMP/models"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'yamnet-classification-tflite-v1-sha256-*.tflite' -O yamnet.tflite
          echo "10c95ea3eb9a7bb4cb8bddf6feb023250381008177ac162ce169694d05c317de  yamnet.tflite" | sha256sum -c -
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern HeroVerse_ASR_base_en_preservado.zip
          echo "78634f845a29c523d117a29a1a14b293220787f5ede2c6c0f33a9b06c2f805cb  HeroVerse_ASR_base_en_preservado.zip" | sha256sum -c -
          "$RUNNER_TEMP/venv/bin/python" -I -c "import sys; from pathlib import Path; sys.path.insert(0, '$GITHUB_WORKSPACE/migration'); import second_opening_asr as a; a.extract_model(Path('HeroVerse_ASR_base_en_preservado.zip'), Path('whisper'))"
      - name: Acquire windows sequentially
        env:
          HERO_RAPIDAPI_KEY: ${{ secrets.HERO_RAPIDAPI_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash migration/acquisition/run_batch.sh "$WINDOWS"
      - name: Compare with the mining (a push made with this job's token does not start workflows)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mining-accuracy.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=compare
