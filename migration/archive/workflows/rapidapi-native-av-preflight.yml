name: HeroVerse native AV quota preflight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: heroverse-native-av-j2rk8ycXe3c-first-window
  cancel-in-progress: false
jobs:
  quota:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify quota header and disclosure controls offline
        run: python3 -m unittest discover -s migration/diagnostics/rapidapi-native-av -p test_preflight.py -v
      - name: Read download contract and one info quota response
        env:
          HERO_RAPIDAPI_KEY: ${{ secrets.HERO_RAPIDAPI_KEY }}
        run: python3 migration/diagnostics/rapidapi-native-av/preflight.py
